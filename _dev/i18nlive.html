<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>툴모아 번역 누락 점검</title>
<style>
  body { font-family:"Malgun Gothic",sans-serif; padding:24px; background:#fff; color:#111; }
  table { border-collapse:collapse; width:100%; max-width:1100px; font-size:14px; }
  th,td { text-align:left; padding:7px 10px; border-bottom:1px solid #ddd; vertical-align:top; }
  th { background:#f2f4f7; }
  .pass { color:#0a7f3f; font-weight:700; }
  .fail { color:#c62828; font-weight:700; }
  #summary { font-size:18px; font-weight:700; margin:16px 0; }
  iframe { position:absolute; left:-9999px; width:1100px; height:900px; border:0; }
  code { background:#f2f4f7; padding:1px 4px; border-radius:3px; }
</style>
</head>
<body>
<h1 style="font-size:22px">번역 누락 점검</h1>
<p style="color:#555;font-size:14px;max-width:980px">
  일본어로 바꾼 뒤, 화면에 한국어가 그대로 남아 있는 곳을 찾는다.
  <code>data-ko-only</code>(FAQ 등 한국어 전용)와 사용자가 넣은 값은 뺀다.
  사전에 키만 만들어두고 페이지에서 <code>t()</code>로 부르지 않으면 이렇게 남는다.
</p>
<div id="summary">실행 중…</div>
<table><thead><tr><th style="width:200px">페이지</th><th style="width:60px">결과</th><th>남아 있는 한국어</th></tr></thead>
<tbody id="rows"></tbody></table>

<script>
// 언어 설정은 localStorage 에 남아 다음 검사까지 따라간다.
// 검사끼리 서로를 오염시키지 않도록 시작할 때 한국어로 맞춘다.
try { localStorage.setItem('toolmoa_lang', 'ko'); } catch (e) {}
var results = [];
function log(n, ok, d) { results.push({ name: n, ok: ok, detail: d }); }

function waitFor(c, ms) {
  var s = Date.now(), lim = ms || 8000;
  return new Promise(function (r) {
    (function p() {
      var o = false; try { o = c(); } catch (e) {}
      if (o || Date.now() - s > lim) { r(o); return; }
      setTimeout(p, 60);
    })();
  });
}
function loadFrame(src) {
  return new Promise(function (res, rej) {
    var f = document.createElement('iframe');
    f.src = src;
    f.onload = function () { setTimeout(function () { res(f); }, 300); };
    f.onerror = function () { rej(new Error('로드 실패: ' + src)); };
    document.body.appendChild(f);
  });
}
var HANGUL = /[가-힣]/;

// 한국어 전용으로 둔 영역 안에 있는가
function inKoOnly(el) {
  for (var n = el; n; n = n.parentElement) {
    if (n.hasAttribute && n.hasAttribute('data-ko-only')) return true;
    // 언어 선택기는 각 언어를 그 언어의 이름으로 적는 게 맞다. 여기 "한국어"는 누락이 아니다.
    if (n.classList && n.classList.contains('lang-select')) return true;
  }
  return false;
}

// 화면에 실제로 보이는 텍스트만 본다
function visible(el, w) {
  if (!el) return false;
  if (el.closest && el.closest('[hidden]')) return false;
  var st = w.getComputedStyle(el);
  if (st.display === 'none' || st.visibility === 'hidden') return false;
  return true;
}

function scanKorean(d, w) {
  var found = [];
  var walker = d.createTreeWalker(d.body, NodeFilter.SHOW_TEXT, null);
  var node;
  while ((node = walker.nextNode())) {
    var s = (node.nodeValue || '').trim();
    if (!s || !HANGUL.test(s)) continue;
    var el = node.parentElement;
    if (!el) continue;
    if (el.tagName === 'SCRIPT' || el.tagName === 'STYLE') continue;
    if (inKoOnly(el)) continue;
    if (!visible(el, w)) continue;
    found.push(s.replace(/\s+/g, ' ').slice(0, 46));
  }
  // 선택지(option)와 placeholder 도 화면에 보이는 글자다
  Array.prototype.forEach.call(d.querySelectorAll('option'), function (o) {
    var s = (o.textContent || '').trim();
    if (s && HANGUL.test(s) && !inKoOnly(o) && visible(o.parentElement, w)) {
      found.push('선택지: ' + s.slice(0, 40));
    }
  });
  Array.prototype.forEach.call(d.querySelectorAll('[placeholder]'), function (i) {
    var s = i.getAttribute('placeholder') || '';
    if (HANGUL.test(s) && !inKoOnly(i) && visible(i, w)) {
      found.push('안내문구: ' + s.slice(0, 40));
    }
  });
  // 중복 제거
  var seen = {}, out = [];
  found.forEach(function (x) { if (!seen[x]) { seen[x] = 1; out.push(x); } });
  return out;
}

// 페이지마다 "결과가 나온 상태"를 만들어야 상세표·안내문구까지 검사할 수 있다
var SETUP = {
  'char-count.html': function (d) {
    var ta = d.getElementById('ta');
    ta.value = '검사용 문장입니다';
    ta.dispatchEvent(new Event('input', { bubbles: true }));
  },
  'age-calc.html': function (d) {
    var b = d.getElementById('birth');
    b.value = '1990-05-05';
    b.dispatchEvent(new Event('change', { bubbles: true }));
  },
  'date-calc.html': function (d) {
    ['from', 'to', 'base'].forEach(function (id) {
      var e = d.getElementById(id);
      if (e && !e.value) { e.value = '2026-01-05'; e.dispatchEvent(new Event('change', { bubbles: true })); }
    });
    var dd = d.getElementById('dday');
    dd.value = '2026-12-25'; dd.dispatchEvent(new Event('change', { bubbles: true }));
  },
  'unit-convert.html': function (d) {
    var v = d.getElementById('val');
    v.value = '10'; v.dispatchEvent(new Event('input', { bubbles: true }));
  },
  'password-gen.html': function (d) { d.getElementById('btn-gen').click(); },
  'text-clean.html': function (d) {
    var s = d.getElementById('src');
    s.value = '하나\n둘\n하나'; s.dispatchEvent(new Event('input', { bubbles: true }));
  },
  'qr-generate.html': function (d) {
    var t = d.getElementById('text');
    t.value = 'https://toolmoa.github.io'; t.dispatchEvent(new Event('input', { bubbles: true }));
  },
  // 결과를 스크립트가 그리는 페이지다. 뽑아 둔 상태에서 봐야 조 이름·안내까지 검사된다.
  // 명단은 일부러 한글이 아닌 것으로 넣는다 — 사용자가 적은 이름은 번역 대상이 아닌데,
  // 한글 이름을 넣으면 이 검사가 "번역이 안 된 한국어"로 잘못 집어낸다.
  'random-pick.html': function (d) {
    var n = d.getElementById('names');
    n.value = 'A\nB\nC\nD';
    n.dispatchEvent(new Event('input', { bubbles: true }));
    d.getElementById('btn-go').click();
  },
  // 비교 결과 표("n줄 같음" 접힘 줄까지)를 그려 둔 상태에서 본다. 입력은 한글이 아닌 것으로.
  'text-diff.html': function (d) {
    var a = d.getElementById('a'), b = d.getElementById('b');
    a.value = 'one\ntwo\nthree\nfour\nfive\nsix\nseven\neight';
    b.value = 'one\ntwo\nthree\nfour\nfive\nsix\nseven\nEIGHT';
    b.dispatchEvent(new Event('input', { bubbles: true }));
  },
  // 사진을 넣어야 설정 칸과 안내문이 보인다
  'image-mosaic.html': function (d) {
    var c = document.createElement('canvas'); c.width = 80; c.height = 60;
    c.getContext('2d').fillRect(0, 0, 80, 60);
    c.toBlob(function (blob) {
      var dt = new DataTransfer();
      dt.items.add(new File([blob], 'x.png', { type: 'image/png' }));
      var input = d.getElementById('file');
      input.files = dt.files;
      input.dispatchEvent(new Event('change', { bubbles: true }));
    }, 'image/png');
  },
  // 사진을 넣어야 설정 칸·목록·안내문이 보인다. 새길 글자는 번역 대상이 아니라 한글이 아닌 것으로.
  'image-watermark.html': function (d) {
    var c = document.createElement('canvas'); c.width = 120; c.height = 80;
    c.getContext('2d').fillRect(0, 0, 120, 80);
    c.toBlob(function (blob) {
      var dt = new DataTransfer();
      dt.items.add(new File([blob], 'x.png', { type: 'image/png' }));
      var input = d.getElementById('file');
      input.files = dt.files;
      input.dispatchEvent(new Event('change', { bubbles: true }));
      d.getElementById('wtext').value = 'SAMPLE';
      d.getElementById('wtext').dispatchEvent(new Event('input', { bubbles: true }));
    }, 'image/png');
  },
  'image-split.html': function (d) {
    var c = document.createElement('canvas'); c.width = 120; c.height = 90;
    c.getContext('2d').fillRect(0, 0, 120, 90);
    c.toBlob(function (blob) {
      var dt = new DataTransfer();
      dt.items.add(new File([blob], 'x.png', { type: 'image/png' }));
      var input = d.getElementById('file');
      input.files = dt.files;
      input.dispatchEvent(new Event('change', { bubbles: true }));
    }, 'image/png');
  },
  // PDF 는 pdf-lib 으로 만든다. 검사 페이지가 직접 만든 2쪽 문서를 넣어 설정 칸·미리보기가 보이게 한다.
  'pdf-watermark.html': function (d) {
    var w = d.defaultView;
    var sc = d.createElement('script'); sc.src = '../assets/vendor/pdf-lib.min.js';
    sc.onload = function () {
      w.PDFLib.PDFDocument.create().then(function (pdf) {
        pdf.addPage([400, 300]); pdf.addPage([400, 300]);
        return pdf.save();
      }).then(function (bytes) {
        var dt = new DataTransfer();
        dt.items.add(new File([bytes], 'sample.pdf', { type: 'application/pdf' }));
        var input = d.getElementById('file');
        input.files = dt.files;
        input.dispatchEvent(new Event('change', { bubbles: true }));
        d.getElementById('wtext').value = 'SAMPLE';
        d.getElementById('wtext').dispatchEvent(new Event('input', { bubbles: true }));
      });
    };
    d.head.appendChild(sc);
  },
  // QR 은 생성 라이브러리로 만들어 넣는다. 내용은 번역 대상이 아니라 영문 주소로.
  'qr-scan.html': function (d) {
    var sc = document.createElement('script'); sc.src = '../assets/vendor/qrcode.min.js';
    sc.onload = function () {
      var q = qrcode(0, 'M'); q.addData('https://toolmoa.github.io/'); q.make();
      var n = q.getModuleCount(), cell = 6, c = document.createElement('canvas');
      c.width = c.height = (n + 8) * cell;
      var x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.fillStyle = '#000';
      for (var r = 0; r < n; r++) for (var k = 0; k < n; k++) if (q.isDark(r, k)) x.fillRect((k + 4) * cell, (r + 4) * cell, cell, cell);
      c.toBlob(function (blob) {
        var dt = new DataTransfer();
        dt.items.add(new File([blob], 'qr.png', { type: 'image/png' }));
        var input = d.getElementById('file');
        input.files = dt.files;
        input.dispatchEvent(new Event('change', { bubbles: true }));
      }, 'image/png');
    };
    document.head.appendChild(sc);
  },
  // 사진을 넣어야 설정 칸·목록·안내문이 보인다
  'image-resize.html': function (d) {
    var c = document.createElement('canvas'); c.width = 120; c.height = 80;
    c.getContext('2d').fillRect(0, 0, 120, 80);
    c.toBlob(function (blob) {
      var dt = new DataTransfer(); dt.items.add(new File([blob], 'x.png', { type: 'image/png' }));
      var input = d.getElementById('file'); input.files = dt.files; input.dispatchEvent(new Event('change', { bubbles: true }));
    }, 'image/png');
  },
  'image-transparent.html': function (d) {
    var c = document.createElement('canvas'); c.width = 120; c.height = 80;
    var x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, 120, 80); x.fillStyle = '#000'; x.fillRect(30, 20, 60, 40);
    c.toBlob(function (blob) {
      var dt = new DataTransfer(); dt.items.add(new File([blob], 'x.png', { type: 'image/png' }));
      var input = d.getElementById('file'); input.files = dt.files; input.dispatchEvent(new Event('change', { bubbles: true }));
    }, 'image/png');
  },
  // PDF 두 쪽을 만들어 올린다 (미리보기 안내문이 그려진 상태에서 본다)
  'pdf-page-number.html': function (d) {
    var w = d.defaultView;
    var sc = d.createElement('script'); sc.src = '../assets/vendor/pdf-lib.min.js';
    sc.onload = function () {
      w.PDFLib.PDFDocument.create().then(function (pdf) {
        pdf.addPage([400, 300]); pdf.addPage([400, 300]);
        return pdf.save();
      }).then(function (bytes) {
        var dt = new DataTransfer();
        dt.items.add(new File([bytes], 'sample.pdf', { type: 'application/pdf' }));
        var input = d.getElementById('file'); input.files = dt.files; input.dispatchEvent(new Event('change', { bubbles: true }));
      });
    };
    d.head.appendChild(sc);
  },
  // 글자가 있는 쪽과 없는 쪽을 만들어 "글자 없는 쪽" 안내가 뜬 상태에서 본다
  'pdf-to-text.html': function (d) {
    var w = d.defaultView;
    var sc = d.createElement('script'); sc.src = '../assets/vendor/pdf-lib.min.js';
    sc.onload = function () {
      w.PDFLib.PDFDocument.create().then(function (pdf) {
        return pdf.embedFont(w.PDFLib.StandardFonts.Helvetica).then(function (font) {
          var p = pdf.addPage([400, 300]); p.drawText('Hello sample', { x: 40, y: 250, size: 14, font: font });
          pdf.addPage([400, 300]);
          return pdf.save();
        });
      }).then(function (bytes) {
        var dt = new DataTransfer();
        dt.items.add(new File([bytes], 'sample.pdf', { type: 'application/pdf' }));
        var input = d.getElementById('file'); input.files = dt.files; input.dispatchEvent(new Event('change', { bubbles: true }));
      });
    };
    d.head.appendChild(sc);
  },
  'favicon.html': function (d) {
    var c = document.createElement('canvas'); c.width = 64; c.height = 64;
    var x = c.getContext('2d'); x.fillStyle = '#2f6df6'; x.fillRect(0, 0, 64, 64);
    c.toBlob(function (blob) {
      var dt = new DataTransfer(); dt.items.add(new File([blob], 'x.png', { type: 'image/png' }));
      var input = d.getElementById('file'); input.files = dt.files; input.dispatchEvent(new Event('change', { bubbles: true }));
    }, 'image/png');
  },
  'image-palette.html': function (d) {
    var c = document.createElement('canvas'); c.width = 120; c.height = 80;
    var x = c.getContext('2d'); x.fillStyle = '#ff0000'; x.fillRect(0, 0, 60, 80); x.fillStyle = '#0000ff'; x.fillRect(60, 0, 60, 80);
    c.toBlob(function (blob) {
      var dt = new DataTransfer(); dt.items.add(new File([blob], 'x.png', { type: 'image/png' }));
      var input = d.getElementById('file'); input.files = dt.files; input.dispatchEvent(new Event('change', { bubbles: true }));
    }, 'image/png');
  },
  'json-format.html': function (d) {
    var s = d.getElementById('src'); s.value = '{a: 1,}'; s.dispatchEvent(new Event('input', { bubbles: true }));
  },
  'file-hash.html': function (d) {
    var tx = d.getElementById('text'); tx.value = 'abc'; tx.dispatchEvent(new Event('input', { bubbles: true }));
    var dt = new DataTransfer(); dt.items.add(new File(['hello'], 'x.txt', { type: 'text/plain' }));
    var input = d.getElementById('file'); input.files = dt.files; input.dispatchEvent(new Event('change', { bubbles: true }));
    var ex = d.getElementById('expect'); ex.value = 'ffff'; ex.dispatchEvent(new Event('input', { bubbles: true }));
  },
  'svg-to-png.html': function (d) {
    var c = d.getElementById('code'); c.value = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 10"><rect width="10" height="10" fill="#f00"/></svg>';
    d.getElementById('btn-code').click();
  },
  'base64.html': function (d) {
    var p = d.getElementById('plain'); p.value = 'abc'; p.dispatchEvent(new Event('input', { bubbles: true }));
    var dc = d.getElementById('dec'); dc.value = 'YWJj'; dc.dispatchEvent(new Event('input', { bubbles: true }));
    var dt = new DataTransfer(); dt.items.add(new File(['hello'], 'x.txt', { type: 'text/plain' }));
    var input = d.getElementById('file'); input.files = dt.files; input.dispatchEvent(new Event('change', { bubbles: true }));
  },
  // 결과 표가 그려진 상태에서 본다. 입력은 사용자 데이터라 번역 대상이 아니므로 한글이 아닌 것으로.
  'romanize.html': function (d) {
    var n = d.getElementById('names'); n.value = 'ABC'; n.dispatchEvent(new Event('input', { bubbles: true }));
  },
  'time-calc.html': function (d) {
    var l = d.getElementById('list'); l.value = '8:30\n90m'; l.dispatchEvent(new Event('input', { bubbles: true }));
  },
  // 결과 목록(지운 항목·"지울 정보 없음"·처리 못 한 이유)이 그려진 상태에서 본다. 파일 이름은 한글이 아닌 것으로.
  'image-exif.html': function (d) {
    var c = document.createElement('canvas'); c.width = 40; c.height = 30;
    c.getContext('2d').fillRect(0, 0, 40, 30);
    c.toBlob(function (blob) {
      var dt = new DataTransfer();
      dt.items.add(new File([blob], 'x.jpg', { type: 'image/jpeg' }));
      dt.items.add(new File(['abc'], 'y.txt', { type: 'text/plain' }));
      var input = d.getElementById('file');
      input.files = dt.files;
      input.dispatchEvent(new Event('change', { bubbles: true }));
    }, 'image/jpeg');
  }
};

var PAGES = ['index.html', 'image-compress.html', 'image-crop.html', 'img-to-pdf.html',
             'char-count.html', 'text-clean.html', 'pdf-merge.html', 'pdf-split.html',
             'pdf-edit.html', 'file-convert.html', 'qr-generate.html', 'password-gen.html',
             'unit-convert.html', 'date-calc.html', 'age-calc.html',
             'pdf-to-image.html', 'image-convert.html', 'image-join.html', 'random-pick.html',
             'text-diff.html', 'image-mosaic.html', 'image-exif.html',
             'image-watermark.html', 'image-split.html', 'pdf-watermark.html', 'qr-scan.html', 'romanize.html', 'time-calc.html', 'color-convert.html', 'barcode.html', 'image-resize.html', 'image-transparent.html',
             'pdf-page-number.html', 'pdf-to-text.html', 'favicon.html', 'image-palette.html',
             'json-format.html', 'file-hash.html', 'svg-to-png.html', 'base64.html'];

function run() {
  var seq = Promise.resolve();
  PAGES.forEach(function (p) {
    seq = seq.then(function () {
      return loadFrame('../' + p).then(function (f) {
        var d = f.contentDocument, w = f.contentWindow;
        if (SETUP[p]) { try { SETUP[p](d); } catch (e) {} }
        return waitFor(function () { return !!d.querySelector('.lang-select'); }, 8000).then(function () {
          var sel = d.querySelector('.lang-select');
          if (!sel) { log(p, false, '언어 선택기를 찾지 못함'); return; }
          sel.value = 'ja';
          sel.dispatchEvent(new Event('change'));
          return waitFor(function () { return d.documentElement.lang === 'ja'; }, 5000).then(function () {
            var left = scanKorean(d, w);
            // 언어 선택은 localStorage 에 남는다. 같은 브라우저 프로필을 쓰는 다른 검사가
            // 일본어 화면을 보고 무더기로 실패하므로, 보고 나면 반드시 한국어로 되돌린다.
            sel.value = 'ko';
            sel.dispatchEvent(new Event('change'));
            log(p, left.length === 0,
                left.length === 0 ? '남은 한국어 없음'
                                  : left.length + '곳 — ' + left.slice(0, 12).join(' | ') +
                                    (left.length > 12 ? ' … 외 ' + (left.length - 12) + '곳' : ''));
          });
        });
      });
    });
  });
  seq.then(render);
}

function render() {
  var pass = results.filter(function (r) { return r.ok; }).length;
  document.getElementById('summary').innerHTML =
    pass + ' / ' + results.length + ' 통과' +
    (pass === results.length ? ' <span class="pass">— 전부 번역됨</span>' : ' <span class="fail">— 누락 있음</span>');
  document.getElementById('rows').innerHTML = results.map(function (r) {
    return '<tr><td>' + r.name + '</td><td class="' + (r.ok ? 'pass">PASS' : 'fail">FAIL') +
           '</td><td>' + r.detail + '</td></tr>';
  }).join('');
  document.title = 'I18N ' + pass + '/' + results.length + ' :: ' +
    results.map(function (r) { return r.name + ' [' + (r.ok ? 'PASS' : 'FAIL') + '] ' + r.detail; }).join(' ;; ');
}

window.addEventListener('load', function () { setTimeout(run, 300); });
</script>
</body>
</html>
