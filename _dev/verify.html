<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>툴모아 결과물 검증</title>
<style>
  body { font-family: "Malgun Gothic", sans-serif; padding: 24px; background:#fff; color:#111; }
  h1 { font-size: 22px; }
  table { border-collapse: collapse; width: 100%; max-width: 1000px; font-size: 15px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #ddd; vertical-align: top; }
  th { background: #f2f4f7; }
  .pass { color: #0a7f3f; font-weight: 700; }
  .fail { color: #c62828; font-weight: 700; }
  #summary { font-size: 18px; font-weight: 700; margin: 16px 0; }
  iframe { position: absolute; left: -9999px; width: 1100px; height: 900px; border: 0; }
</style>
</head>
<body>
<h1>결과물 검증 — 저장된 파일을 실제로 열어서 확인</h1>
<p style="color:#555;font-size:14px;max-width:900px">
  화면 상태만 보는 것이 아니라, 각 툴이 <strong>실제로 만들어낸 파일을 가로채서 다시 열어</strong>
  페이지 수·해상도·인코딩·QR 내용이 맞는지 확인한다.
</p>
<div id="summary">실행 중…</div>
<table><thead><tr><th style="width:190px">항목</th><th style="width:70px">결과</th><th>검증 내용</th></tr></thead>
<tbody id="rows"></tbody></table>

<script src="../assets/vendor/pdf-lib.min.js"></script>
<script src="../assets/vendor/xlsx.full.min.js"></script>
<script src="jsQR.js"></script>
<script src="../assets/zip.js"></script>
<script>
var results = [];
function log(name, ok, detail) { results.push({ name: name, ok: ok, detail: detail }); }

function waitFor(cond, maxMs) {
  var start = Date.now(), limit = maxMs || 10000;
  return new Promise(function (res) {
    (function poll() {
      var ok = false;
      try { ok = cond(); } catch (e) { ok = false; }
      if (ok || Date.now() - start > limit) { res(ok); return; }
      setTimeout(poll, 100);
    })();
  });
}

function loadFrame(src) {
  return new Promise(function (res, rej) {
    var f = document.createElement('iframe');
    f.src = src;
    f.onload = function () { setTimeout(function () { res(f); }, 300); };
    f.onerror = function () { rej(new Error('로드 실패: ' + src)); };
    document.body.appendChild(f);
  });
}

function setFiles(input, files) {
  var dt = new DataTransfer();
  files.forEach(function (f) { dt.items.add(f); });
  input.files = dt.files;
  input.dispatchEvent(new Event('change', { bubbles: true }));
}

// 툴이 만든 Blob을 가로챈다. 실제 다운로드 창은 뜨지 않게 막는다.
//
// 주의: 툴은 입력 파일을 미리보기용으로 열 때도 createObjectURL을 쓴다.
// 그래서 "마지막 Blob"을 결과물로 보면 원본을 집게 된다.
// 반드시 기준 시점(mark) 이후에 생긴 것 중에서, 기대하는 MIME 타입으로 골라야 한다.
function capture(f) {
  var w = f.contentWindow, out = [];
  var orig = w.URL.createObjectURL.bind(w.URL);
  w.URL.createObjectURL = function (b) { out.push(b); return orig(b); };
  w.HTMLAnchorElement.prototype.click = function () {};
  return out;
}

function pickNew(got, mark, typeRe) {
  var list = got.slice(mark).filter(function (b) { return typeRe.test(b.type || ''); });
  return list.length ? list[list.length - 1] : null;
}

function waitNew(got, mark, typeRe, ms) {
  return waitFor(function () { return !!pickNew(got, mark, typeRe); }, ms || 15000);
}

// Blob.text()는 선행 BOM을 제거해버리므로, BOM 확인은 원시 바이트로 해야 한다
function firstBytes(blob, n) {
  return blob.arrayBuffer().then(function (buf) {
    return Array.prototype.slice.call(new Uint8Array(buf, 0, n));
  });
}

// 압축 없이 담은(store) ZIP만 읽는 최소 해석기.
// zip.js의 코드를 재사용하지 않는다 — 쓰는 쪽과 읽는 쪽이 같은 실수를 공유하면 검증이 성립하지 않는다.
function readZipEntries(u8) {
  var dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  var eocd = -1;
  for (var i = u8.length - 22; i >= 0; i--) {
    if (dv.getUint32(i, true) === 0x06054B50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('끝 기록(EOCD)을 찾지 못함');
  var count = dv.getUint16(eocd + 10, true);
  var cdOff = dv.getUint32(eocd + 16, true);
  var dec = new TextDecoder('utf-8');
  var out = [], p = cdOff;
  for (var n = 0; n < count; n++) {
    if (dv.getUint32(p, true) !== 0x02014B50) throw new Error('중앙 디렉터리 서명 불일치');
    var flags = dv.getUint16(p + 8, true);
    var method = dv.getUint16(p + 10, true);
    var crc = dv.getUint32(p + 16, true);
    var size = dv.getUint32(p + 24, true);
    var nameLen = dv.getUint16(p + 28, true);
    var extraLen = dv.getUint16(p + 30, true);
    var cmtLen = dv.getUint16(p + 32, true);
    var lhOff = dv.getUint32(p + 42, true);
    var name = dec.decode(u8.subarray(p + 46, p + 46 + nameLen));
    if (dv.getUint32(lhOff, true) !== 0x04034B50) throw new Error('로컬 헤더 서명 불일치');
    var start = lhOff + 30 + dv.getUint16(lhOff + 26, true) + dv.getUint16(lhOff + 28, true);
    out.push({ name: name, method: method, utf8: !!(flags & 0x0800), crc: crc,
               bytes: u8.subarray(start, start + size) });
    p += 46 + nameLen + extraLen + cmtLen;
  }
  return out;
}

function pdfPages(blob) {
  return blob.arrayBuffer()
    .then(function (buf) { return PDFLib.PDFDocument.load(new Uint8Array(buf), { ignoreEncryption: true }); })
    .then(function (d) { return d.getPageCount(); });
}
function imgSize(blob) {
  return createImageBitmap(blob).then(function (b) { return { w: b.width, h: b.height }; });
}
function makePdf(n) {
  return PDFLib.PDFDocument.create().then(function (doc) {
    for (var i = 0; i < n; i++) { doc.addPage([300, 400]); }
    return doc.save();
  });
}
function makeImg(w, h, color) {
  var c = document.createElement('canvas');
  c.width = w; c.height = h;
  var x = c.getContext('2d');
  var g = x.createLinearGradient(0, 0, w, h);
  g.addColorStop(0, color); g.addColorStop(1, '#ffffff');
  x.fillStyle = g; x.fillRect(0, 0, w, h);
  for (var i = 0; i < 200; i++) {                       // 압축이 실제로 줄어들도록 잡음을 넣는다
    x.fillStyle = 'rgba(' + (i * 11 % 255) + ',' + (i * 23 % 255) + ',' + (i * 37 % 255) + ',.6)';
    x.fillRect((i * 97) % w, (i * 61) % h, 30, 30);
  }
  return new Promise(function (r) { c.toBlob(r, 'image/png'); });
}

function run() {
  var chain = Promise.resolve();

  // 1. PDF 합치기 — 저장된 PDF를 다시 열어 페이지 수 확인
  chain = chain.then(function () {
    return Promise.all([makePdf(2), makePdf(4)]).then(function (b) {
      return loadFrame('../pdf-merge.html').then(function (f) {
        var d = f.contentDocument, got = capture(f);
        setFiles(d.getElementById('file'), [
          new File([b[0]], 'a.pdf', { type: 'application/pdf' }),
          new File([b[1]], 'b.pdf', { type: 'application/pdf' })
        ]);
        return waitFor(function () { return d.getElementById('t-files').textContent !== '0'; })
          .then(function () {
            d.getElementById('btn-merge').click();
            return waitFor(function () { return got.length > 0; }, 12000);
          }).then(function () {
            if (!got.length) { log('PDF 합치기 결과', false, '저장된 파일이 없음'); return; }
            return pdfPages(got[got.length - 1]).then(function (n) {
              log('PDF 합치기 결과', n === 6,
                  '2쪽 + 4쪽을 합친 파일을 다시 열어보니 ' + n + '쪽 (기대: 6쪽), ' +
                  Math.round(got[got.length - 1].size / 1024) + 'KB');
            });
          });
      });
    });
  }).catch(function (e) { log('PDF 합치기 결과', false, '오류: ' + e.message); });

  // 2. PDF 나누기 — 추출된 PDF의 페이지 수 확인
  chain = chain.then(function () {
    return makePdf(5).then(function (bytes) {
      return loadFrame('../pdf-split.html').then(function (f) {
        var d = f.contentDocument, got = capture(f);
        setFiles(d.getElementById('file'), [new File([bytes], 's.pdf', { type: 'application/pdf' })]);
        return waitFor(function () { return d.getElementById('t-pages').textContent !== '0'; })
          .then(function () {
            var r = d.getElementById('range');
            r.value = '1-3,5'; r.dispatchEvent(new Event('input'));
            d.getElementById('btn-go').click();
            return waitFor(function () { return got.length > 0; }, 12000);
          }).then(function () {
            if (!got.length) { log('PDF 나누기 결과', false, '저장된 파일이 없음'); return; }
            return pdfPages(got[got.length - 1]).then(function (n) {
              log('PDF 나누기 결과', n === 4,
                  '5쪽 문서에서 "1-3,5"를 뽑은 파일이 ' + n + '쪽 (기대: 4쪽)');
            });
          });
      });
    });
  }).catch(function (e) { log('PDF 나누기 결과', false, '오류: ' + e.message); });

  // 3. 이미지 → PDF — 만들어진 PDF의 페이지 수 확인
  chain = chain.then(function () {
    return Promise.all([makeImg(800, 600, '#e63946'), makeImg(600, 900, '#1d3557')]).then(function (bl) {
      return loadFrame('../img-to-pdf.html').then(function (f) {
        var d = f.contentDocument, got = capture(f);
        setFiles(d.getElementById('file'), [
          new File([bl[0]], 'a.png', { type: 'image/png' }),
          new File([bl[1]], 'b.png', { type: 'image/png' })
        ]);
        return waitFor(function () { return d.getElementById('t-count').textContent !== '0'; })
          .then(function () {
            var mark = got.length;
            d.getElementById('btn-make').click();
            return waitNew(got, mark, /pdf/, 20000).then(function () {
              var out = pickNew(got, mark, /pdf/);
              if (!out) { log('이미지→PDF 결과', false, 'PDF가 만들어지지 않음'); return; }
              return pdfPages(out).then(function (n) {
                log('이미지→PDF 결과', n === 2,
                    '사진 2장으로 만든 PDF가 ' + n + '쪽 (기대: 2쪽), ' +
                    Math.round(out.size / 1024) + 'KB');
              });
            });
          });
      });
    });
  }).catch(function (e) { log('이미지→PDF 결과', false, '오류: ' + e.message); });

  // 4. 이미지 압축 — 저장된 이미지를 디코딩해 해상도·용량 확인
  chain = chain.then(function () {
    return makeImg(2000, 1500, '#2f6df6').then(function (blob) {
      var originalSize = blob.size;
      return loadFrame('../image-compress.html').then(function (f) {
        var d = f.contentDocument, got = capture(f);
        d.getElementById('maxw').value = '1280';
        d.getElementById('format').value = 'image/jpeg';
        var mark = got.length;
        setFiles(d.getElementById('file'), [new File([blob], 'p.png', { type: 'image/png' })]);
        // 원본 미리보기 Blob(png)과 구분하기 위해 jpeg만 고른다
        return waitNew(got, mark, /jpeg/, 20000).then(function () {
          var out = pickNew(got, mark, /jpeg/);
          if (!out) { log('이미지 압축 결과', false, '압축 결과가 만들어지지 않음'); return; }
          return imgSize(out).then(function (s) {
            var ok = s.w === 1280 && s.h === 960 && out.size < originalSize;
            log('이미지 압축 결과', ok,
                '저장된 파일을 열어보니 ' + s.w + '×' + s.h + ' (기대 1280×960), ' +
                'MIME ' + out.type + ', 용량 ' + Math.round(originalSize / 1024) + 'KB → ' +
                Math.round(out.size / 1024) + 'KB');
          });
        });
      });
    });
  }).catch(function (e) { log('이미지 압축 결과', false, '오류: ' + e.message); });

  // 5. 이미지 자르기 — 저장된 이미지가 실제로 잘린 크기인지 확인
  chain = chain.then(function () {
    return makeImg(1000, 800, '#17864a').then(function (blob) {
      return loadFrame('../image-crop.html').then(function (f) {
        var d = f.contentDocument, got = capture(f);
        setFiles(d.getElementById('file'), [new File([blob], 'c.png', { type: 'image/png' })]);
        return waitFor(function () { return d.getElementById('t-orig').textContent !== '-'; })
          .then(function () {
            var r = d.getElementById('ratio');
            r.value = '1'; r.dispatchEvent(new Event('change'));   // 정사각형 고정
            var expect = d.getElementById('t-crop').textContent;
            var mark = got.length;
            d.getElementById('btn-save').click();
            return waitNew(got, mark, /png/, 15000).then(function () {
              return { expect: expect, mark: mark };
            });
          }).then(function (ctx) {
            var out = pickNew(got, ctx.mark, /png/);
            if (!out) { log('이미지 자르기 결과', false, '자른 결과가 만들어지지 않음'); return; }
            return imgSize(out).then(function (s) {
              var square = Math.abs(s.w - s.h) <= 1;
              var matches = (s.w + '×' + s.h) === ctx.expect;
              log('이미지 자르기 결과', square && matches && s.w < 1000,
                  '화면 표시 ' + ctx.expect + ' → 저장된 파일 ' + s.w + '×' + s.h +
                  ' (일치 ' + (matches ? 'OK' : '불일치') + ', 정사각형 ' + (square ? 'OK' : '실패') + ')');
            });
          });
      });
    });
  }).catch(function (e) { log('이미지 자르기 결과', false, '오류: ' + e.message); });

  // 6. CSV 저장 — BOM이 실제로 붙었는지 + 한글이 살아있는지
  chain = chain.then(function () {
    return loadFrame('../file-convert.html').then(function (f) {
      var d = f.contentDocument, got = capture(f);
      var json = JSON.stringify([{ 이름: '홍길동', 부서: '영업팀' }, { 이름: '김철수', 부서: '개발팀' }]);
      setFiles(d.getElementById('file'), [new File([json], 'x.json', { type: 'application/json' })]);
      return waitFor(function () { return d.getElementById('t-rows').textContent !== '0'; })
        .then(function () {
          d.getElementById('target').value = 'csv';
          var mark = got.length;
          d.getElementById('btn-convert').click();
          return waitNew(got, mark, /csv|text/, 12000).then(function () { return mark; });
        }).then(function (mark) {
          var out = pickNew(got, mark, /csv|text/);
          if (!out) { log('CSV 저장 결과 (BOM)', false, 'CSV가 만들어지지 않음'); return; }
          // BOM은 Blob.text()가 삼켜버리므로 원시 바이트로 확인한다 (EF BB BF)
          return firstBytes(out, 3).then(function (b) {
            var hasBom = b[0] === 0xEF && b[1] === 0xBB && b[2] === 0xBF;
            return out.text().then(function (txt) {
              var hasKo = txt.indexOf('홍길동') >= 0 && txt.indexOf('영업팀') >= 0;
              var lines = txt.replace(/^﻿/, '').trim().split(/\r?\n/);
              log('CSV 저장 결과 (BOM)', hasBom && hasKo && lines.length === 3,
                  '선두 바이트 ' + b.map(function (x) { return x.toString(16).toUpperCase(); }).join(' ') +
                  ' → BOM ' + (hasBom ? '있음 (엑셀에서 한글 정상)' : '없음 ⚠') +
                  ', 한글 ' + (hasKo ? 'OK' : '깨짐') + ', ' + lines.length + '줄 · 첫 줄 "' + lines[0] + '"');
            });
          });
        });
    });
  }).catch(function (e) { log('CSV 저장 결과 (BOM)', false, '오류: ' + e.message); });

  // 7. 엑셀 저장 — 만들어진 xlsx를 다시 파싱
  chain = chain.then(function () {
    return loadFrame('../file-convert.html').then(function (f) {
      var d = f.contentDocument, got = capture(f);
      var csv = '이름,점수\n홍길동,90\n김철수,85\n';
      setFiles(d.getElementById('file'), [new File([csv], 'x.csv', { type: 'text/csv' })]);
      return waitFor(function () { return d.getElementById('t-rows').textContent !== '0'; })
        .then(function () {
          d.getElementById('target').value = 'xlsx';
          d.getElementById('btn-convert').click();
          return waitFor(function () { return got.length > 0; }, 12000);
        }).then(function () {
          if (!got.length) { log('엑셀 저장 결과', false, '저장된 파일이 없음'); return; }
          return got[got.length - 1].arrayBuffer().then(function (buf) {
            var wb = XLSX.read(new Uint8Array(buf), { type: 'array' });
            var rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' });
            var ok = rows.length === 2 && rows[0]['이름'] === '홍길동' && String(rows[0]['점수']) === '90';
            log('엑셀 저장 결과', ok,
                '저장된 xlsx를 다시 열어보니 ' + rows.length + '행, 첫 행 = ' +
                JSON.stringify(rows[0]) + ' (기대: 2행 / 홍길동 90)');
          });
        });
    });
  }).catch(function (e) { log('엑셀 저장 결과', false, '오류: ' + e.message); });

  // 8. QR — 만들어진 QR을 실제로 판독해서 내용이 같은지 확인
  chain = chain.then(function () {
    if (typeof jsQR === 'undefined') { log('QR 판독', false, 'jsQR 로드 실패'); return; }
    var target = 'https://toolmoa.github.io/pdf-merge.html?x=1';
    return loadFrame('../qr-generate.html').then(function (f) {
      var d = f.contentDocument;
      var t = d.getElementById('text');
      t.value = target; t.dispatchEvent(new Event('input'));
      return waitFor(function () { return !d.getElementById('canvas').hidden; }, 10000).then(function () {
        var c = d.getElementById('canvas');
        var im = c.getContext('2d').getImageData(0, 0, c.width, c.height);
        var decoded = jsQR(new Uint8ClampedArray(im.data), c.width, c.height);
        var text = decoded ? decoded.data : '(판독 실패)';
        log('QR 판독', !!decoded && text === target,
            '만든 QR을 다시 스캔한 결과 "' + text + '" (원본과 ' + (text === target ? '일치' : '불일치') + ')');
      });
    });
  }).catch(function (e) { log('QR 판독', false, '오류: ' + e.message); });

  // 9. 영어판 PDF 합치기도 동일하게 결과물 확인
  chain = chain.then(function () {
    return Promise.all([makePdf(3), makePdf(3)]).then(function (b) {
      return loadFrame('../en/pdf-merge.html').then(function (f) {
        var d = f.contentDocument, got = capture(f);
        setFiles(d.getElementById('file'), [
          new File([b[0]], 'a.pdf', { type: 'application/pdf' }),
          new File([b[1]], 'b.pdf', { type: 'application/pdf' })
        ]);
        return waitFor(function () { return d.getElementById('t-files').textContent !== '0'; })
          .then(function () {
            d.getElementById('btn-merge').click();
            return waitFor(function () { return got.length > 0; }, 12000);
          }).then(function () {
            if (!got.length) { log('EN: PDF 합치기 결과', false, '저장된 파일이 없음'); return; }
            return pdfPages(got[got.length - 1]).then(function (n) {
              log('EN: PDF 합치기 결과', n === 6, '3쪽 + 3쪽 → ' + n + '쪽 (기대: 6쪽)');
            });
          });
      });
    });
  }).catch(function (e) { log('EN: PDF 합치기 결과', false, '오류: ' + e.message); });

  // 10. QR 프리셋 — 와이파이·연락처가 규격대로 인코딩되는지 실제 판독으로 확인
  chain = chain.then(function () {
    if (typeof jsQR === 'undefined') { log('QR 프리셋 판독', false, 'jsQR 로드 실패'); return; }
    return loadFrame('../qr-generate.html').then(function (f) {
      var d = f.contentDocument;

      function decode() {
        var c = d.getElementById('canvas');
        if (c.hidden) return null;
        var im = c.getContext('2d').getImageData(0, 0, c.width, c.height);
        var r = jsQR(new Uint8ClampedArray(im.data), c.width, c.height);
        return r ? r.data : null;
      }
      function set(id, v) {
        var el = d.getElementById(id);
        el.value = v;
        el.dispatchEvent(new Event('input', { bubbles: true }));
      }

      // --- 와이파이 ---
      var ty = d.getElementById('qtype');
      ty.value = 'wifi'; ty.dispatchEvent(new Event('change'));
      set('w-ssid', 'Cafe Toolmoa');
      set('w-pw', 'pass1234');
      return waitFor(function () { return !d.getElementById('canvas').hidden; }, 8000).then(function () {
        var wifi = decode();
        var wifiOk = wifi === 'WIFI:T:WPA;S:Cafe Toolmoa;P:pass1234;;';

        // --- 연락처 ---
        ty.value = 'vcard'; ty.dispatchEvent(new Event('change'));
        set('v-name', '홍길동');
        set('v-tel', '01012345678');
        return waitFor(function () { return !d.getElementById('canvas').hidden; }, 8000).then(function () {
          var card = decode() || '';
          var cardOk = card.indexOf('BEGIN:VCARD') === 0 &&
                       card.indexOf('FN:홍길동') >= 0 &&
                       card.indexOf('TEL;TYPE=CELL:01012345678') >= 0 &&
                       card.indexOf('END:VCARD') > 0;

          var cv = d.getElementById('canvas');
          log('QR 프리셋 판독', wifiOk && cardOk,
              '와이파이 → "' + wifi + '" ' + (wifiOk ? 'OK' : '규격 불일치 ⚠') +
              ' · 연락처 → "' + card.replace(/\n/g, ' / ') + '" ' + (cardOk ? 'OK' : '불일치 ⚠') +
              ' [캔버스 ' + (cv.hidden ? '숨김' : cv.width + 'x' + cv.height) +
              ', 화면메시지 "' + (d.getElementById('msg').textContent.trim() || '없음') + '"]');
        });
      });
    });
  }).catch(function (e) { log('QR 프리셋 판독', false, '오류: ' + e.message); });

  // 11. 한글이 들어간 QR이 제대로 인코딩되는지 (한국어 사이트에서는 치명적인 지점)
  chain = chain.then(function () {
    if (typeof jsQR === 'undefined') { log('QR 한글 인코딩', false, 'jsQR 로드 실패'); return; }
    var KO = '안녕하세요 툴모아입니다';
    return loadFrame('../qr-generate.html').then(function (f) {
      var d = f.contentDocument;
      var t2 = d.getElementById('text');
      t2.value = KO;
      t2.dispatchEvent(new Event('input'));
      return waitFor(function () { return !d.getElementById('canvas').hidden; }, 8000).then(function () {
        var c = d.getElementById('canvas');
        var im = c.getContext('2d').getImageData(0, 0, c.width, c.height);
        var r = jsQR(new Uint8ClampedArray(im.data), c.width, c.height);
        var got = r ? r.data : '(판독 실패)';
        log('QR 한글 인코딩', got === KO,
            '원본 "' + KO + '" → 판독 "' + got + '"' + (got === KO ? '' : ' ⚠'));
      });
    });
  }).catch(function (e) { log('QR 한글 인코딩', false, '오류: ' + e.message); });

  // 12. 영어판 QR도 같은 기능이 실제로 동작하는지 (한국어판만 고치고 넘어가기 쉬운 지점)
  chain = chain.then(function () {
    if (typeof jsQR === 'undefined') { log('EN: QR 프리셋·한글', false, 'jsQR 로드 실패'); return; }
    return loadFrame('../en/qr-generate.html').then(function (f) {
      var d = f.contentDocument;
      function decode() {
        var c = d.getElementById('canvas');
        if (c.hidden) return null;
        var im = c.getContext('2d').getImageData(0, 0, c.width, c.height);
        var r = jsQR(new Uint8ClampedArray(im.data), c.width, c.height);
        return r ? r.data : null;
      }
      function set(id, v) {
        var el = d.getElementById(id);
        el.value = v;
        el.dispatchEvent(new Event('input', { bubbles: true }));
      }
      var ty = d.getElementById('qtype');
      if (!ty) { log('EN: QR 프리셋·한글', false, '영어판에 종류 선택이 없음'); return; }

      ty.value = 'wifi'; ty.dispatchEvent(new Event('change'));
      set('w-ssid', 'Toolmoa Guest');
      set('w-pw', 'hello123');
      return waitFor(function () { return !d.getElementById('canvas').hidden; }, 8000).then(function () {
        var wifi = decode();
        // 비ASCII도 영어판에서 제대로 인코딩되는지 확인 (한국어판만 고쳤을 위험)
        ty.value = 'text'; ty.dispatchEvent(new Event('change'));
        set('text', 'Café Toolmoa 안녕');
        return waitFor(function () { return !d.getElementById('canvas').hidden; }, 8000).then(function () {
          var uni = decode();
          log('EN: QR 프리셋·비ASCII',
              wifi === 'WIFI:T:WPA;S:Toolmoa Guest;P:hello123;;' && uni === 'Café Toolmoa 안녕',
              '와이파이 → "' + wifi + '" · 비ASCII → "' + uni + '"');
        });
      });
    });
  }).catch(function (e) { log('EN: QR 프리셋·비ASCII', false, '오류: ' + e.message); });

  // 13. ZIP 쓰기 자체를 검증한다.
  //     내가 직접 만든 형식이므로, zip.js의 함수를 재사용해 확인하면 순환 논증이 된다.
  //     여기서는 CRC도 ZIP 해석도 zip.js와 무관하게 따로 구현해 대조한다.
  chain = chain.then(function () {
    // 테이블 없이 비트 단위로 도는 CRC-32. zip.js의 테이블 방식과 구현이 다르다.
    function crcSlow(u8) {
      var c = 0xFFFFFFFF;
      for (var i = 0; i < u8.length; i++) {
        c ^= u8[i];
        for (var k = 0; k < 8; k++) c = (c & 1) ? ((c >>> 1) ^ 0xEDB88320) : (c >>> 1);
      }
      return (c ^ 0xFFFFFFFF) >>> 0;
    }

    var a = new Uint8Array([0, 1, 2, 250, 251, 255, 65, 66]);
    var b = new Uint8Array(5000);
    for (var i = 0; i < b.length; i++) b[i] = (i * 31 + 7) & 0xFF;
    var entries = [
      { name: '한글 이름 1쪽.pdf', bytes: a },
      { name: 'plain.bin', bytes: b },
      { name: '한글 이름 1쪽.pdf', bytes: a }   // 이름이 겹치면 뒤에 번호가 붙어야 한다
    ];
    var blob = makeZip(entries);
    return blob.arrayBuffer().then(function (ab) {
      var got = readZipEntries(new Uint8Array(ab));
      var names = got.map(function (g) { return g.name; });
      var sameA = got[0].bytes.length === a.length &&
                  Array.prototype.every.call(a, function (v, k) { return got[0].bytes[k] === v; });
      var sameB = got[1].bytes.length === b.length &&
                  Array.prototype.every.call(b, function (v, k) { return got[1].bytes[k] === v; });
      var crcOk = got[0].crc === crcSlow(a) && got[1].crc === crcSlow(b);
      var stored = got.every(function (g) { return g.method === 0; });
      var utf8 = got.every(function (g) { return g.utf8; });
      var dedup = names[0] === '한글 이름 1쪽.pdf' && names[2] === '한글 이름 1쪽 (2).pdf';
      log('ZIP 형식 (직접 해석)',
          got.length === 3 && sameA && sameB && crcOk && stored && utf8 && dedup,
          '항목 ' + got.length + '개, 내용 일치 ' + (sameA && sameB ? 'OK' : '불일치') +
          ', CRC 별도 계산 일치 ' + (crcOk ? 'OK' : '불일치') +
          ', 무압축 ' + (stored ? 'OK' : '아님') + ', UTF-8 이름 표시 ' + (utf8 ? 'OK' : '없음') +
          ', 이름 중복 처리 "' + names[2] + '" (기대 "한글 이름 1쪽 (2).pdf"), ' + blob.size + 'B');
    });
  }).catch(function (e) { log('ZIP 형식 (직접 해석)', false, '오류: ' + e.message); });

  // 14. PDF 낱장 나누기를 ZIP으로 받았을 때, 안에 든 것이 진짜 낱장 PDF인지
  chain = chain.then(function () {
    return makePdf(4).then(function (bytes) {
      return loadFrame('../pdf-split.html').then(function (f) {
        var d = f.contentDocument, got = capture(f);
        setFiles(d.getElementById('file'), [new File([bytes], '문서.pdf', { type: 'application/pdf' })]);
        return waitFor(function () { return d.getElementById('t-pages').textContent === '4'; }, 15000)
          .then(function () {
            var mode = d.getElementById('mode');
            mode.value = 'each'; mode.dispatchEvent(new Event('change', { bubbles: true }));
            var zipShown = !d.getElementById('zip-field').hidden;
            var checked = d.getElementById('as-zip').checked;
            var mark = got.length;
            d.getElementById('btn-go').click();
            return waitNew(got, mark, /zip/, 30000).then(function () {
              var z = pickNew(got, mark, /zip/);
              var pdfs = got.slice(mark).filter(function (x) { return /pdf/.test(x.type || ''); });
              if (!z) { log('PDF 낱장 ZIP', false, 'ZIP이 만들어지지 않음'); return; }
              return z.arrayBuffer().then(function (ab) {
                var items = readZipEntries(new Uint8Array(ab));
                return Promise.all(items.map(function (it) {
                  return PDFLib.PDFDocument.load(it.bytes.slice(), { ignoreEncryption: true })
                    .then(function (doc) { return doc.getPageCount(); });
                })).then(function (counts) {
                  var allOne = counts.length === 4 && counts.every(function (c) { return c === 1; });
                  log('PDF 낱장 ZIP',
                      zipShown && checked && allOne && pdfs.length === 0 && !f.dataset.errs,
                      '4쪽 → ZIP 1개 (' + Math.round(z.size / 1024) + 'KB) 안에 ' + counts.length +
                      '개, 각 ' + counts.join('/') + '쪽, 첫 이름 "' + items[0].name + '", ' +
                      '개별 다운로드 ' + pdfs.length + '건 (기대 0), 체크박스 표시 ' +
                      (zipShown ? 'OK' : '숨음') + (f.dataset.errs ? ' · JS오류 ' + f.dataset.errs : ''));
                });
              });
            });
          });
      });
    });
  }).catch(function (e) { log('PDF 낱장 ZIP', false, '오류: ' + e.message); });

  // 15. 체크를 풀면 예전처럼 낱장으로 따로 받아져야 한다 (선택권이 실제로 동작하는지)
  chain = chain.then(function () {
    return makePdf(3).then(function (bytes) {
      return loadFrame('../pdf-split.html').then(function (f) {
        var d = f.contentDocument, got = capture(f);
        setFiles(d.getElementById('file'), [new File([bytes], 'x.pdf', { type: 'application/pdf' })]);
        return waitFor(function () { return d.getElementById('t-pages').textContent === '3'; }, 15000)
          .then(function () {
            var mode = d.getElementById('mode');
            mode.value = 'each'; mode.dispatchEvent(new Event('change', { bubbles: true }));
            d.getElementById('as-zip').checked = false;
            var mark = got.length;
            d.getElementById('btn-go').click();
            return waitFor(function () {
              return got.slice(mark).filter(function (x) { return /pdf/.test(x.type || ''); }).length >= 3;
            }, 30000).then(function () {
              var pdfs = got.slice(mark).filter(function (x) { return /pdf/.test(x.type || ''); });
              var zips = got.slice(mark).filter(function (x) { return /zip/.test(x.type || ''); });
              log('낱장 ZIP 해제',
                  pdfs.length === 3 && zips.length === 0 && !f.dataset.errs,
                  '체크 해제 → 개별 PDF ' + pdfs.length + '개 (기대 3), ZIP ' + zips.length + '개 (기대 0)' +
                  (f.dataset.errs ? ' · JS오류 ' + f.dataset.errs : ''));
            });
          });
      });
    });
  }).catch(function (e) { log('낱장 ZIP 해제', false, '오류: ' + e.message); });

  // 16. 이미지 압축 여러 장 → ZIP
  chain = chain.then(function () {
    return Promise.all([makeImg(900, 700, '#2f6df6'), makeImg(700, 900, '#e04b2f')]).then(function (bl) {
      return loadFrame('../image-compress.html').then(function (f) {
        var d = f.contentDocument, got = capture(f);
        setFiles(d.getElementById('file'), [
          new File([bl[0]], '사진 하나.png', { type: 'image/png' }),
          new File([bl[1]], '사진 둘.png', { type: 'image/png' })
        ]);
        return waitFor(function () { return d.getElementById('t-count').textContent === '2'; }, 20000)
          .then(function () {
            var mark = got.length;
            d.getElementById('btn-all').click();
            return waitNew(got, mark, /zip/, 25000).then(function () {
              var z = pickNew(got, mark, /zip/);
              if (!z) { log('이미지 압축 ZIP', false, 'ZIP이 만들어지지 않음'); return; }
              return z.arrayBuffer().then(function (ab) {
                var items = readZipEntries(new Uint8Array(ab));
                // 안에 든 것이 진짜 이미지인지 확인한다 (이름만 맞고 내용이 빈 경우를 걸러낸다)
                return Promise.all(items.map(function (it) {
                  return createImageBitmap(new Blob([it.bytes.slice()]))
                    .then(function (b) { return b.width + '×' + b.height; })
                    .catch(function () { return '못 읽음'; });
                })).then(function (sizes) {
                  var ok = items.length === 2 && sizes.every(function (s) { return s !== '못 읽음'; });
                  log('이미지 압축 ZIP', ok && !f.dataset.errs,
                      '2장 → ZIP 1개 (' + Math.round(z.size / 1024) + 'KB) 안에 ' + items.length +
                      '개: ' + items.map(function (it, i) { return '"' + it.name + '" ' + sizes[i]; }).join(', ') +
                      (f.dataset.errs ? ' · JS오류 ' + f.dataset.errs : ''));
                });
              });
            });
          });
      });
    });
  }).catch(function (e) { log('이미지 압축 ZIP', false, '오류: ' + e.message); });

  // 17. 붙여넣기(Ctrl+V)로 들어온 이미지가 실제로 처리되는지
  chain = chain.then(function () {
    return makeImg(640, 480, '#1f9d55').then(function (blob) {
      return loadFrame('../image-compress.html').then(function (f) {
        var d = f.contentDocument;
        // 클립보드 이벤트를 흉내 낸다. DataTransfer에 파일을 담으면 items[].kind가 'file'이 된다.
        var dt = new DataTransfer();
        dt.items.add(new File([blob], 'image.png', { type: 'image/png' }));
        var ev = new ClipboardEvent('paste', { clipboardData: dt, bubbles: true, cancelable: true });
        d.dispatchEvent(ev);
        return waitFor(function () { return d.getElementById('t-count').textContent === '1'; }, 20000)
          .then(function (ok) {
            var name = (d.querySelector('#list .fname') || {}).textContent || '';
            log('붙여넣기로 이미지 넣기',
                ok && name.indexOf('붙여넣은-사진') >= 0 && !f.dataset.errs,
                'Ctrl+V 흉내 → 처리한 장수 "' + d.getElementById('t-count').textContent +
                '", 이름 "' + name.trim() + '" (기대: 붙여넣은-사진…)' +
                (f.dataset.errs ? ' · JS오류 ' + f.dataset.errs : ''));
          });
      });
    });
  }).catch(function (e) { log('붙여넣기로 이미지 넣기', false, '오류: ' + e.message); });

  chain.then(render);
}

function render() {
  var pass = results.filter(function (r) { return r.ok; }).length;
  document.getElementById('summary').innerHTML =
    pass + ' / ' + results.length + ' 통과' +
    (pass === results.length ? ' <span class="pass">— 결과물 전부 정상</span>' : ' <span class="fail">— 실패 있음</span>');
  document.getElementById('rows').innerHTML = results.map(function (r) {
    return '<tr><td>' + r.name + '</td><td class="' + (r.ok ? 'pass">PASS' : 'fail">FAIL') +
           '</td><td>' + r.detail + '</td></tr>';
  }).join('');
  document.title = 'VERIFY ' + pass + '/' + results.length + ' :: ' +
    results.map(function (r) {
      return r.name + ' [' + (r.ok ? 'PASS' : 'FAIL') + '] ' + r.detail;
    }).join(' ;; ');
}

window.addEventListener('load', function () { setTimeout(run, 300); });
</script>
