<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>툴모아 예외 상황 점검</title>
<style>
  body { font-family: "Malgun Gothic", sans-serif; padding: 24px; background:#fff; color:#111; }
  h1 { font-size: 22px; }
  table { border-collapse: collapse; width: 100%; max-width: 1050px; font-size: 15px; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid #ddd; vertical-align: top; }
  th { background: #f2f4f7; }
  .pass { color: #0a7f3f; font-weight: 700; }
  .fail { color: #c62828; font-weight: 700; }
  #summary { font-size: 18px; font-weight: 700; margin: 16px 0; }
  iframe { position: absolute; left: -9999px; width: 1100px; height: 900px; border: 0; }
</style>
</head>
<body>
<h1>예외 상황 점검</h1>
<p style="color:#555;font-size:14px;max-width:950px">
  깨진 파일·빈 파일·잘못된 입력을 넣었을 때 <strong>죽지 않고 사람이 이해할 수 있는 안내를 내는지</strong> 확인한다.
  더불어 전 페이지를 열어 자바스크립트 오류가 나는지 훑는다.
</p>
<div id="summary">실행 중…</div>
<table><thead><tr><th style="width:230px">항목</th><th style="width:70px">결과</th><th>확인 내용</th></tr></thead>
<tbody id="rows"></tbody></table>

<script>
// 언어 설정은 localStorage 에 남아 다음 검사까지 따라간다.
// 검사끼리 서로를 오염시키지 않도록 시작할 때 한국어로 맞춘다.
try { localStorage.setItem('toolmoa_lang', 'ko'); } catch (e) {}
var results = [];
function log(name, ok, detail) { results.push({ name: name, ok: ok, detail: detail }); }
function waitFor(cond, maxMs) {
  var start = Date.now(), limit = maxMs || 12000;
  return new Promise(function (res) {
    (function poll() {
      var ok = false;
      try { ok = cond(); } catch (e) { ok = false; }
      if (ok || Date.now() - start > limit) { res(ok); return; }
      setTimeout(poll, 100);
    })();
  });
}
// 페이지에서 발생하는 자바스크립트 오류를 모두 수집한다
function loadFrame(src) {
  return new Promise(function (res, rej) {
    var f = document.createElement('iframe');
    f.dataset.errs = '';
    f.src = src;
    f.onload = function () {
      try {
        f.contentWindow.addEventListener('error', function (e) {
          f.dataset.errs += (e.message || 'error') + ' | ';
        });
        f.contentWindow.addEventListener('unhandledrejection', function (e) {
          f.dataset.errs += 'unhandled: ' + ((e.reason && e.reason.message) || e.reason) + ' | ';
        });
      } catch (e) { /* 무시 */ }
      setTimeout(function () { res(f); }, 300);
    };
    f.onerror = function () { rej(new Error('로드 실패: ' + src)); };
    document.body.appendChild(f);
  });
}
function setFiles(input, files) {
  var dt = new DataTransfer();
  files.forEach(function (f) { dt.items.add(f); });
  input.files = dt.files;
  input.dispatchEvent(new Event('change', { bubbles: true }));
}
function msgOf(d) {
  var m = d.getElementById('msg');
  return m ? m.textContent.trim() : '';
}
function grab(p) { return fetch(p).then(function (r) { return r.blob(); }); }

// 파일 하나를 넣고, 안내 문구가 뜨는지 / 죽지 않는지 확인하는 공통 절차
function expectMessage(page, file, name, wants, opts) {
  opts = opts || {};
  return loadFrame('../' + page).then(function (f) {
    var d = f.contentDocument;
    setFiles(d.getElementById('file'), [file]);
    return waitFor(function () {
      var m = msgOf(d);
      return m && !/읽는 중|준비하는 중|변환 중/.test(m);
    }, opts.ms || 12000).then(function () {
      var m = msgOf(d);
      var hit = wants.some(function (w) { return m.indexOf(w) >= 0; });
      var errs = f.dataset.errs;
      log(name, hit && !errs,
          '안내: "' + (m || '(없음)') + '"' + (errs ? ' · JS 오류: ' + errs : ''));
    });
  }).catch(function (e) { log(name, false, '예외: ' + e.message); });
}

function run() {
  var chain = Promise.resolve();

  // === 1. EUC-KR CSV (지금까지 실제로 검증하지 못했던 경로) ===
  chain = chain.then(function () {
    return grab('fixtures/euckr.csv').then(function (b) {
      return loadFrame('../file-convert.html').then(function (f) {
        var d = f.contentDocument;
        setFiles(d.getElementById('file'), [new File([b], 'euckr.csv', { type: 'text/csv' })]);
        return waitFor(function () { return d.getElementById('t-rows').textContent !== '0'; })
          .then(function () {
            var rows = d.getElementById('t-rows').textContent;
            var cols = d.getElementById('t-cols').textContent;
            var prev = d.getElementById('preview').textContent;
            var ok = rows === '2' && cols === '3' &&
                     prev.indexOf('홍길동') >= 0 && prev.indexOf('영업팀') >= 0;
            log('EUC-KR CSV 자동 판별', ok,
                rows + '행 ' + cols + '열, 미리보기에 "홍길동/영업팀" ' +
                (prev.indexOf('홍길동') >= 0 ? '정상' : '깨짐 ⚠') +
                ' · 안내: "' + msgOf(d).slice(0, 60) + '"');
          });
      });
    });
  }).catch(function (e) { log('EUC-KR CSV 자동 판별', false, '예외: ' + e.message); });

  // === 2~6. 깨진/빈 파일들 ===
  chain = chain.then(function () {
    return grab('fixtures/empty.pdf').then(function (b) {
      return expectMessage('pdf-merge.html', new File([b], 'empty.pdf', { type: 'application/pdf' }),
        '빈 PDF (0바이트)', ['열 수 없습니다', '손상']);
    });
  });
  chain = chain.then(function () {
    return grab('fixtures/corrupt.pdf').then(function (b) {
      return expectMessage('pdf-merge.html', new File([b], 'corrupt.pdf', { type: 'application/pdf' }),
        '손상된 PDF', ['열 수 없습니다', '손상']);
    });
  });
  chain = chain.then(function () {
    return grab('fixtures/notreally.pdf').then(function (b) {
      return expectMessage('pdf-split.html', new File([b], 'notreally.pdf', { type: 'application/pdf' }),
        'PDF가 아닌데 확장자만 .pdf', ['열 수 없습니다', '손상']);
    });
  });
  chain = chain.then(function () {
    return grab('fixtures/notimage.jpg').then(function (b) {
      return expectMessage('image-crop.html', new File([b], 'notimage.jpg', { type: 'image/jpeg' }),
        '이미지가 아닌데 확장자만 .jpg', ['열 수 없습니다', '이미지']);
    });
  });
  chain = chain.then(function () {
    return grab('fixtures/broken.json').then(function (b) {
      return expectMessage('file-convert.html', new File([b], 'broken.json', { type: 'application/json' }),
        '깨진 JSON', ['올바르지 않습니다', 'JSON']);
    });
  });
  chain = chain.then(function () {
    return grab('fixtures/headeronly.csv').then(function (b) {
      return expectMessage('file-convert.html', new File([b], 'headeronly.csv', { type: 'text/csv' }),
        '헤더만 있는 CSV', ['비어 있습니다']);
    });
  });
  chain = chain.then(function () {
    return grab('fixtures/object.json').then(function (b) {
      return expectMessage('file-convert.html', new File([b], 'object.json', { type: 'application/json' }),
        '배열이 아닌 JSON', ['배열', '비어 있습니다']);
    });
  });

  // === 7. 페이지 범위 예외 ===
  chain = chain.then(function () {
    return grab('fixtures/real-b.pdf').then(function (b) {
      return loadFrame('../pdf-split.html').then(function (f) {
        var d = f.contentDocument;
        setFiles(d.getElementById('file'), [new File([b], 'r.pdf', { type: 'application/pdf' })]);
        return waitFor(function () { return d.getElementById('t-pages').textContent !== '0'; })
          .then(function () {
            var total = parseInt(d.getElementById('t-pages').textContent, 10);
            var r = d.getElementById('range');
            // (1) 범위를 완전히 벗어난 입력
            r.value = '99-100'; r.dispatchEvent(new Event('input'));
            var over = d.getElementById('t-pick').textContent;
            // (2) 거꾸로 쓴 범위
            r.value = '2-1'; r.dispatchEvent(new Event('input'));
            var rev = d.getElementById('t-pick').textContent;
            // (3) 글자가 섞인 입력
            r.value = 'abc,3'; r.dispatchEvent(new Event('input'));
            var junk = d.getElementById('t-pick').textContent;
            log('PDF 페이지 범위 예외', over === '없음' && rev !== '없음' && !f.dataset.errs,
                '전체 ' + total + '쪽 · "99-100"→' + over + ' (기대: 없음), "2-1"→' + rev +
                ' (거꾸로 써도 처리), "abc,3"→' + junk + (f.dataset.errs ? ' · JS오류 ' + f.dataset.errs : ''));
          });
      });
    });
  }).catch(function (e) { log('PDF 페이지 범위 예외', false, '예외: ' + e.message); });

  // === 8. QR: 너무 긴 내용 / 빈 내용 ===
  chain = chain.then(function () {
    return loadFrame('../qr-generate.html').then(function (f) {
      var d = f.contentDocument, t = d.getElementById('text');
      var long = new Array(3001).join('A');
      t.value = long; t.dispatchEvent(new Event('input'));
      return waitFor(function () { return msgOf(d).length > 0; }, 8000).then(function () {
        var m = msgOf(d);
        var canvasHidden = d.getElementById('canvas').hidden;
        var btnOff = d.getElementById('btn-png').disabled;
        t.value = ''; t.dispatchEvent(new Event('input'));   // 빈 입력으로 되돌리기
        var backToPlaceholder = d.getElementById('canvas').hidden;
        log('QR 예외 (너무 김 / 빈 입력)',
            m.indexOf('너무 깁니다') >= 0 && canvasHidden && btnOff && backToPlaceholder && !f.dataset.errs,
            '3000자 입력 → "' + m.slice(0, 50) + '", 캔버스 숨김 ' + (canvasHidden ? 'OK' : '실패') +
            ', 저장버튼 비활성 ' + (btnOff ? 'OK' : '실패') +
            ' · 빈 입력 복귀 ' + (backToPlaceholder ? 'OK' : '실패'));
      });
    });
  }).catch(function (e) { log('QR 예외 (너무 김 / 빈 입력)', false, '예외: ' + e.message); });

  // === 9. 날짜 계산 예외 ===
  chain = chain.then(function () {
    return loadFrame('../date-calc.html').then(function (f) {
      var d = f.contentDocument;
      // 끝 날짜가 시작보다 앞선 경우
      d.getElementById('from').value = '2026-03-10';
      d.getElementById('to').value = '2026-03-01';
      d.getElementById('from').dispatchEvent(new Event('input'));
      d.getElementById('to').dispatchEvent(new Event('input'));
      var back = d.getElementById('b-days').textContent;
      // 윤년 2월 29일
      d.getElementById('from').value = '2028-02-28';
      d.getElementById('to').value = '2028-03-01';
      d.getElementById('to').dispatchEvent(new Event('input'));
      var leap = d.getElementById('b-days').textContent;
      log('날짜 계산 예외', back === '9일' && leap === '2일' && !f.dataset.errs,
          '끝<시작 (3/10→3/1) = ' + back + ' (기대 9일), 윤년 2028-02-28→03-01 = ' + leap +
          ' (기대 2일, 2/29 포함)' + (f.dataset.errs ? ' · JS오류' : ''));
    });
  }).catch(function (e) { log('날짜 계산 예외', false, '예외: ' + e.message); });

  // === 10. 만 나이: 미래 생일 ===
  chain = chain.then(function () {
    return loadFrame('../age-calc.html').then(function (f) {
      var d = f.contentDocument;
      var n = new Date(), fut = new Date(n.getFullYear() + 1, n.getMonth(), n.getDate());
      d.getElementById('birth').value = fut.getFullYear() + '-' +
        ('0' + (fut.getMonth() + 1)).slice(-2) + '-' + ('0' + fut.getDate()).slice(-2);
      d.getElementById('birth').dispatchEvent(new Event('input'));
      var txt = d.getElementById('detail').textContent;
      var age = d.getElementById('a-full').textContent;
      log('만 나이 예외 (미래 날짜)', txt.indexOf('뒤의 날짜') >= 0 && age === '-' && !f.dataset.errs,
          '내년 날짜 입력 → 나이 "' + age + '", 안내 "' + txt.trim().slice(0, 40) + '"');
    });
  }).catch(function (e) { log('만 나이 예외 (미래 날짜)', false, '예외: ' + e.message); });

  // === 11. 단위 변환 예외 ===
  chain = chain.then(function () {
    return loadFrame('../unit-convert.html').then(function (f) {
      var d = f.contentDocument;
      var v = d.getElementById('val');
      v.value = ''; v.dispatchEvent(new Event('input'));
      var emptyMsg = d.getElementById('out').textContent.indexOf('숫자를 입력') >= 0;
      v.value = '-40'; v.dispatchEvent(new Event('input'));
      var neg = d.getElementById('out').querySelectorAll('tr').length > 0;
      // 절대영도: -273.15°C = 0K
      var c = d.getElementById('cat');
      c.value = 'temp'; c.dispatchEvent(new Event('change'));
      v.value = '-273.15'; v.dispatchEvent(new Event('input'));
      var rows = d.getElementById('out').querySelectorAll('tr');
      var kelvin = rows.length >= 3 ? rows[2].children[1].textContent.trim() : '?';
      log('단위 변환 예외', emptyMsg && neg && kelvin === '0' && !f.dataset.errs,
          '빈 입력 안내 ' + (emptyMsg ? 'OK' : '실패') + ', 음수 처리 ' + (neg ? 'OK' : '실패') +
          ', -273.15°C = ' + kelvin + 'K (기대 0)');
    });
  }).catch(function (e) { log('단위 변환 예외', false, '예외: ' + e.message); });

  // === 12. 글자수: 이모지(서로게이트 쌍) ===
  chain = chain.then(function () {
    return loadFrame('../char-count.html').then(function (f) {
      var d = f.contentDocument, ta = d.getElementById('ta');
      ta.value = '가나다🎂👨‍👩‍👧';        // 이모지와 결합 문자
      ta.dispatchEvent(new Event('input'));
      var all = d.getElementById('s-all').textContent;
      ta.value = '';
      ta.dispatchEvent(new Event('input'));
      var zero = d.getElementById('s-all').textContent;
      log('글자수 예외 (이모지·빈 입력)', parseInt(all, 10) >= 4 && zero === '0' && !f.dataset.errs,
          '"가나다🎂👨‍👩‍👧" → ' + all + '자 (이모지가 2자로 쪼개지지 않아야 함), 빈 입력 → ' + zero);
    });
  }).catch(function (e) { log('글자수 예외 (이모지·빈 입력)', false, '예외: ' + e.message); });

  // === 13. 전 페이지 자바스크립트 오류 훑기 ===
  chain = chain.then(function () {
    var pages = ['index.html', 'image-compress.html', 'image-crop.html', 'img-to-pdf.html',
                 'char-count.html', 'pdf-merge.html', 'pdf-split.html', 'file-convert.html',
                 'qr-generate.html', 'unit-convert.html', 'date-calc.html', 'age-calc.html',
                 'pdf-edit.html', 'text-clean.html', 'password-gen.html',
                 'en/index.html', 'en/image-compress.html', 'en/image-crop.html', 'en/img-to-pdf.html',
                 'en/pdf-merge.html', 'en/pdf-split.html', 'en/file-convert.html', 'en/qr-generate.html'];
    var bad = [];
    var seq = Promise.resolve();
    pages.forEach(function (p) {
      seq = seq.then(function () {
        return loadFrame('../' + p).then(function (f) {
          return new Promise(function (r) { setTimeout(r, 500); }).then(function () {
            if (f.dataset.errs) bad.push(p + ': ' + f.dataset.errs);
            // 언어 선택기가 제대로 붙었는지도 함께 본다
            var hasSwitcher = !!(f.contentDocument.querySelector('.lang-select') ||
                                 f.contentDocument.querySelector('.lang-link'));
            if (!hasSwitcher) bad.push(p + ': 언어 전환 요소 없음');
          });
        }).catch(function (e) { bad.push(p + ': ' + e.message); });
      });
    });
    return seq.then(function () {
      log('전 페이지 JS 오류 훑기', bad.length === 0,
          pages.length + '개 페이지 확인 · ' + (bad.length ? '문제: ' + bad.join(' ;; ') : '오류 없음'));
    });
  });

  chain.then(render);
}

function render() {
  var pass = results.filter(function (r) { return r.ok; }).length;
  document.getElementById('summary').innerHTML =
    pass + ' / ' + results.length + ' 통과' +
    (pass === results.length ? ' <span class="pass">— 예외 처리 정상</span>' : ' <span class="fail">— 확인 필요</span>');
  document.getElementById('rows').innerHTML = results.map(function (r) {
    return '<tr><td>' + r.name + '</td><td class="' + (r.ok ? 'pass">PASS' : 'fail">FAIL') +
           '</td><td>' + r.detail + '</td></tr>';
  }).join('');
  document.title = 'EDGE ' + pass + '/' + results.length + ' :: ' +
    results.map(function (r) { return r.name + ' [' + (r.ok ? 'PASS' : 'FAIL') + '] ' + r.detail; }).join(' ;; ');
}

window.addEventListener('load', function () { setTimeout(run, 300); });
</script>
</body>
</html>
