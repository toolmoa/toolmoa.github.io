<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>툴모아 자동 점검</title>
<style>
  body { font-family: "Malgun Gothic", sans-serif; padding: 24px; background:#fff; color:#111; }
  h1 { font-size: 22px; }
  table { border-collapse: collapse; width: 100%; max-width: 900px; font-size: 15px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #ddd; }
  th { background: #f2f4f7; }
  .pass { color: #0a7f3f; font-weight: 700; }
  .fail { color: #c62828; font-weight: 700; }
  #summary { font-size: 18px; font-weight: 700; margin: 16px 0; }
  iframe { position: absolute; left: -9999px; width: 1100px; height: 900px; border: 0; }
</style>
</head>
<body>
<h1>툴모아 자동 점검 결과</h1>
<div id="summary">실행 중…</div>
<table><thead><tr><th style="width:170px">항목</th><th style="width:70px">결과</th><th>측정값</th></tr></thead>
<tbody id="rows"></tbody></table>

<script src="../assets/vendor/pdf-lib.min.js"></script>
<script>
// 언어 설정은 localStorage 에 남아 다음 검사까지 따라간다.
// 검사끼리 서로를 오염시키지 않도록 시작할 때 한국어로 맞춘다.
try { localStorage.setItem('toolmoa_lang', 'ko'); } catch (e) {}
var results = [];
function log(name, ok, detail) { results.push({ name: name, ok: ok, detail: detail }); }
function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

// 고정 대기 대신 조건이 만족될 때까지 폴링한다.
// 헤드리스 가상 시간에서도 파일 읽기가 끝날 때까지 기다리게 하려는 목적.
function waitFor(cond, maxMs) {
  var start = Date.now(), limit = maxMs || 8000;
  return new Promise(function (res) {
    (function poll() {
      var ok = false;
      try { ok = cond(); } catch (e) { ok = false; }
      if (ok || Date.now() - start > limit) { res(ok); return; }
      setTimeout(poll, 100);
    })();
  });
}

function loadFrame(src) {
  return new Promise(function (res, rej) {
    var f = document.createElement('iframe');
    f.src = src;
    f.onload = function () { setTimeout(function () { res(f); }, 300); };
    f.onerror = function () { rej(new Error('iframe 로드 실패: ' + src)); };
    document.body.appendChild(f);
  });
}

function setFiles(input, files) {
  var dt = new DataTransfer();
  files.forEach(function (f) { dt.items.add(f); });
  input.files = dt.files;
  input.dispatchEvent(new Event('change', { bubbles: true }));
}

function txt(d, id) { return d.getElementById(id).textContent.trim(); }

function run() {
  var chain = Promise.resolve();

  // 1. 글자수 세기
  chain = chain.then(function () {
    return loadFrame('../char-count.html').then(function (f) {
      var d = f.contentDocument;
      var ta = d.getElementById('ta');
      ta.value = '안녕하세요 반갑습니다';           // 공백포함 11자 / 제외 10자 / 2단어
      ta.dispatchEvent(new Event('input'));
      var all = txt(d, 's-all'), nos = txt(d, 's-nospace'), w = txt(d, 's-words');
      log('글자수 세기', all === '11' && nos === '10' && w === '2',
          '공백포함 ' + all + '자 / 제외 ' + nos + '자 / ' + w + '단어 (기대: 11/10/2)');
    });
  }).catch(function (e) { log('글자수 세기', false, '오류: ' + e.message); });

  // 2. QR 생성
  chain = chain.then(function () {
    return loadFrame('../qr-generate.html').then(function (f) {
      var d = f.contentDocument;
      var t = d.getElementById('text');
      t.value = 'https://example.com';
      t.dispatchEvent(new Event('input'));
      return waitFor(function () { return !d.getElementById('canvas').hidden; }, 8000).then(function () {
        var c = d.getElementById('canvas');
        var px = c.getContext('2d').getImageData(0, 0, c.width, c.height).data;
        var dark = 0, light = 0;
        for (var i = 0; i < px.length; i += 4) {
          if (px[i + 3] < 128) continue;              // 투명 픽셀 제외 (미렌더 오탐 방지)
          if (px[i] < 100) dark++; else if (px[i] > 200) light++;
        }
        log('QR 생성', !c.hidden && dark > 500 && light > 500,
            '캔버스 ' + c.width + '×' + c.height + ', 검정 ' + dark.toLocaleString() +
            ' / 흰색 ' + light.toLocaleString() + ' 픽셀');
      });
    });
  }).catch(function (e) { log('QR 생성', false, '오류: ' + e.message); });

  // 3. CSV 읽기 (UTF-8, BOM 없음 — 한글 깨짐 여부가 핵심)
  chain = chain.then(function () {
    return loadFrame('../file-convert.html').then(function (f) {
      var d = f.contentDocument;
      var csv = '이름,나이,도시\n홍길동,30,서울\n김철수,25,부산\n';
      setFiles(d.getElementById('file'), [new File([csv], 'test.csv', { type: 'text/csv' })]);
      return waitFor(function () { return txt(d, 't-rows') !== '0'; }, 10000).then(function () {
        var rows = txt(d, 't-rows'), cols = txt(d, 't-cols');
        var hangul = d.getElementById('preview').textContent.indexOf('홍길동') >= 0;
        log('CSV 읽기 (한글)', rows === '2' && cols === '3' && hangul,
            rows + '행 ' + cols + '열, 한글 표시 ' + (hangul ? 'OK' : '깨짐') +
            ' (기대: 2행 3열) · 메시지[' + txt(d, 'msg') + ']');
      });
    });
  }).catch(function (e) { log('CSV 읽기 (한글)', false, '오류: ' + e.message); });

  // 4. CSV → JSON 변환 결과 검증
  chain = chain.then(function () {
    return loadFrame('../file-convert.html').then(function (f) {
      var d = f.contentDocument;
      var json = JSON.stringify([{ 이름: '홍길동', 점수: 90 }, { 이름: '김철수', 점수: 85 }]);
      setFiles(d.getElementById('file'), [new File([json], 'test.json', { type: 'application/json' })]);
      return waitFor(function () { return txt(d, 't-rows') !== '0'; }, 10000).then(function () {
        var rows = txt(d, 't-rows'), from = txt(d, 't-from');
        var hangul = d.getElementById('preview').textContent.indexOf('홍길동') >= 0;
        log('JSON 읽기', rows === '2' && from === 'JSON' && hangul,
            rows + '행, 원본형식 "' + from + '", 한글 ' + (hangul ? 'OK' : '깨짐') +
            ' · 메시지[' + txt(d, 'msg') + ']');
      });
    });
  }).catch(function (e) { log('JSON 읽기', false, '오류: ' + e.message); });

  // 5. 이미지 압축
  chain = chain.then(function () {
    var cv = document.createElement('canvas');
    cv.width = 2000; cv.height = 1500;
    var cx = cv.getContext('2d');
    var g = cx.createLinearGradient(0, 0, 2000, 1500);
    g.addColorStop(0, '#e63946'); g.addColorStop(.5, '#f1faee'); g.addColorStop(1, '#1d3557');
    cx.fillStyle = g; cx.fillRect(0, 0, 2000, 1500);
    for (var i = 0; i < 400; i++) {           // 압축률을 현실적으로 만들기 위한 잡음
      cx.fillStyle = 'rgba(' + (i * 7 % 255) + ',' + (i * 13 % 255) + ',' + (i * 29 % 255) + ',.5)';
      cx.fillRect((i * 137) % 2000, (i * 71) % 1500, 40, 40);
    }
    return new Promise(function (res) { cv.toBlob(res, 'image/png'); }).then(function (blob) {
      return loadFrame('../image-compress.html').then(function (f) {
        var d = f.contentDocument;
        d.getElementById('maxw').value = '1280';
        setFiles(d.getElementById('file'), [new File([blob], 'test.png', { type: 'image/png' })]);
        return waitFor(function () { return txt(d, 't-count') !== '0'; }, 10000).then(function () {
          var link = d.querySelector('#list a[download]');
          log('이미지 압축', txt(d, 't-count') === '1' && !!link,
              txt(d, 't-count') + '장, ' + txt(d, 't-before') + ' → ' + txt(d, 't-after') +
              ' (' + txt(d, 't-saved') + ' 절약), 저장링크 ' + (link ? 'OK' : '없음'));
        });
      });
    });
  }).catch(function (e) { log('이미지 압축', false, '오류: ' + e.message); });

  // 6. PDF 읽기·정렬 + 실제 병합
  chain = chain.then(function () {
    if (typeof PDFLib === 'undefined') { log('PDF 합치기', false, 'pdf-lib 로드 실패'); return; }
    function makePdf(n, name) {
      return PDFLib.PDFDocument.create().then(function (doc) {
        for (var i = 0; i < n; i++) { doc.addPage([300, 400]); }
        return doc.save();
      }).then(function (bytes) { return new File([bytes], name, { type: 'application/pdf' }); });
    }
    return Promise.all([makePdf(2, 'a.pdf'), makePdf(3, 'b.pdf')]).then(function (files) {
      return loadFrame('../pdf-merge.html').then(function (f) {
        var d = f.contentDocument;
        setFiles(d.getElementById('file'), files);
        return waitFor(function () { return txt(d, 't-files') !== '0'; }, 12000).then(function () {
          var n = txt(d, 't-files'), pages = txt(d, 't-pages');
          var items = d.getElementById('list').querySelectorAll('li').length;
          log('PDF 읽기·정렬', n === '2' && pages === '5' && items === 2,
              n + '개 파일, 총 ' + pages + '쪽, 목록 ' + items + '행 (기대: 2개 5쪽) · 메시지[' + txt(d, 'msg') + ']');

          // 순서 변경(↓ 버튼)이 실제로 동작하는지도 확인
          var el = d.querySelector('#list li .fname');
          if (!el) { log('PDF 순서 변경', false, '목록이 비어 있어 확인 불가'); return; }
          var firstBefore = el.textContent;
          var downBtn = d.querySelectorAll('#list li button')[1];
          if (downBtn) downBtn.click();
          var after = d.querySelector('#list li .fname');
          var firstAfter = after ? after.textContent : '(없음)';
          log('PDF 순서 변경', firstBefore !== firstAfter,
              '"' + firstBefore + '" → "' + firstAfter + '"');
        });
      });
    });
  }).catch(function (e) { log('PDF 읽기·정렬', false, '오류: ' + e.message); });

  // 7. 이미지 → PDF
  chain = chain.then(function () {
    function mkImg(w, h, color) {
      var c = document.createElement('canvas'); c.width = w; c.height = h;
      var x = c.getContext('2d'); x.fillStyle = color; x.fillRect(0, 0, w, h);
      return new Promise(function (r) { c.toBlob(r, 'image/png'); });
    }
    return Promise.all([mkImg(800, 600, '#e63946'), mkImg(600, 900, '#1d3557')]).then(function (bl) {
      return loadFrame('../img-to-pdf.html').then(function (f) {
        var d = f.contentDocument;
        setFiles(d.getElementById('file'), [
          new File([bl[0]], 'a.png', { type: 'image/png' }),
          new File([bl[1]], 'b.png', { type: 'image/png' })
        ]);
        return waitFor(function () { return txt(d, 't-count') !== '0'; }, 10000).then(function () {
          var items = d.getElementById('list').querySelectorAll('li').length;
          log('이미지→PDF', txt(d, 't-count') === '2' && items === 2,
              txt(d, 't-count') + '장, 목록 ' + items + '행 (기대: 2/2) · 메시지[' + txt(d, 'msg') + ']');
        });
      });
    });
  }).catch(function (e) { log('이미지→PDF', false, '오류: ' + e.message); });

  // 8. PDF 나누기 (5쪽 문서에서 "1-3,5" → 4쪽 선택되어야 함)
  chain = chain.then(function () {
    if (typeof PDFLib === 'undefined') { log('PDF 나누기', false, 'pdf-lib 로드 실패'); return; }
    return PDFLib.PDFDocument.create().then(function (doc) {
      for (var i = 0; i < 5; i++) { doc.addPage([300, 400]); }
      return doc.save();
    }).then(function (bytes) {
      return loadFrame('../pdf-split.html').then(function (f) {
        var d = f.contentDocument;
        setFiles(d.getElementById('file'), [new File([bytes], 'src.pdf', { type: 'application/pdf' })]);
        return waitFor(function () { return txt(d, 't-pages') !== '0'; }, 12000).then(function () {
          var pages = txt(d, 't-pages');
          var r = d.getElementById('range');
          r.value = '1-3,5';
          r.dispatchEvent(new Event('input'));
          var pick = txt(d, 't-pick');
          log('PDF 나누기', pages === '5' && pick === '4쪽',
              '전체 ' + pages + '쪽, 범위 "1-3,5" → ' + pick +
              ' (기대: 5쪽 / 4쪽) · 메시지[' + txt(d, 'msg') + ']');
        });
      });
    });
  }).catch(function (e) { log('PDF 나누기', false, '오류: ' + e.message); });

  // 9. 날짜 계산기
  chain = chain.then(function () {
    return loadFrame('../date-calc.html').then(function (f) {
      var d = f.contentDocument;
      var n = new Date();
      var t = new Date(n.getFullYear(), n.getMonth(), n.getDate() + 10);
      var iso = t.getFullYear() + '-' + ('0' + (t.getMonth() + 1)).slice(-2) + '-' + ('0' + t.getDate()).slice(-2);
      var dd = d.getElementById('dday');
      dd.value = iso;
      dd.dispatchEvent(new Event('input'));
      var label = txt(d, 'd-label');
      var days = txt(d, 'b-days');     // 초기값이 오늘 ~ 오늘+30 이므로 30일이어야 함
      log('날짜 계산기', label === 'D-10' && days === '30일',
          '디데이 ' + label + ' (기대 D-10), 기본 기간 ' + days + ' (기대 30일)');
    });
  }).catch(function (e) { log('날짜 계산기', false, '오류: ' + e.message); });

  // 10. 만 나이 계산기 (정확히 30년 전 같은 날 → 만 30세)
  chain = chain.then(function () {
    return loadFrame('../age-calc.html').then(function (f) {
      var d = f.contentDocument;
      var n = new Date();
      var b = new Date(n.getFullYear() - 30, n.getMonth(), n.getDate());
      var iso = b.getFullYear() + '-' + ('0' + (b.getMonth() + 1)).slice(-2) + '-' + ('0' + b.getDate()).slice(-2);
      var el = d.getElementById('birth');
      el.value = iso;
      el.dispatchEvent(new Event('input'));
      var full = txt(d, 'a-full'), kor = txt(d, 'a-korean');
      log('만 나이 계산기', full === '30세' && kor === '31세',
          '만 ' + full + ' / 세는 ' + kor + ' (기대: 30세 / 31세)');
    });
  }).catch(function (e) { log('만 나이 계산기', false, '오류: ' + e.message); });

  // 11. 단위 변환기 (1평 = 3.3058㎡ 인지 확인)
  chain = chain.then(function () {
    return loadFrame('../unit-convert.html').then(function (f) {
      var d = f.contentDocument;
      var v = d.getElementById('val');
      v.value = '1';
      v.dispatchEvent(new Event('input'));
      var rows = d.getElementById('out').querySelectorAll('tr');
      var sqm = rows.length ? rows[0].children[1].textContent.trim() : '';
      // 온도 변환도 함께 확인: 32°F = 0°C
      var c = d.getElementById('cat');
      c.value = 'temp'; c.dispatchEvent(new Event('change'));
      d.getElementById('unit').value = '1';                      // 화씨
      d.getElementById('unit').dispatchEvent(new Event('change'));
      v.value = '32'; v.dispatchEvent(new Event('input'));
      var celsius = d.getElementById('out').querySelectorAll('tr')[0].children[1].textContent.trim();
      log('단위 변환기', sqm.indexOf('3.3') === 0 && celsius === '0',
          '1평=' + sqm + '㎡ (기대 3.3058), 32°F=' + celsius + '°C (기대 0)');
    });
  }).catch(function (e) { log('단위 변환기', false, '오류: ' + e.message); });

  // 12. 이미지 자르기
  chain = chain.then(function () {
    var cv = document.createElement('canvas');
    cv.width = 1000; cv.height = 800;
    var cx = cv.getContext('2d');
    cx.fillStyle = '#2f6df6'; cx.fillRect(0, 0, 1000, 800);
    return new Promise(function (r) { cv.toBlob(r, 'image/png'); }).then(function (blob) {
      return loadFrame('../image-crop.html').then(function (f) {
        var d = f.contentDocument;
        setFiles(d.getElementById('file'), [new File([blob], 'c.png', { type: 'image/png' })]);
        return waitFor(function () { return txt(d, 't-orig') !== '-'; }, 10000).then(function () {
          var orig = txt(d, 't-orig'), cropSize = txt(d, 't-crop');
          // 1:1 비율 고정 시 가로세로가 같아져야 한다
          var r = d.getElementById('ratio');
          r.value = '1'; r.dispatchEvent(new Event('change'));
          var sq = txt(d, 't-crop').split('×');
          var isSquare = sq.length === 2 && Math.abs(+sq[0] - +sq[1]) <= 1;
          log('이미지 자르기', orig === '1000×800' && cropSize.indexOf('×') > 0 && isSquare,
              '원본 ' + orig + ' (기대 1000×800), 기본선택 ' + cropSize +
              ', 1:1 고정 → ' + txt(d, 't-crop') + (isSquare ? ' 정사각형 OK' : ' 정사각형 실패'));
        });
      });
    });
  }).catch(function (e) { log('이미지 자르기', false, '오류: ' + e.message); });

  // 13. 다국어 전환
  chain = chain.then(function () {
    return loadFrame('../index.html').then(function (f) {
      var d = f.contentDocument;
      var sel = d.querySelector('.lang-select');
      if (!sel) { log('다국어 전환 (일본어)', false, '언어 선택기가 없음'); return; }
      var koH1 = d.querySelector('h1').textContent.trim();

      // 영어는 실제 /en/ 페이지로 이동하므로 여기서는 일본어 전환만 확인한다
      // (영어 이동은 "EN 이동 연결" 항목에서 따로 검증)
      sel.value = 'ja'; sel.dispatchEvent(new Event('change'));
      var jaH1 = d.querySelector('h1').textContent.trim();
      var jaNav = d.querySelector('.site-nav a').textContent.trim();
      var jaLang = d.documentElement.lang;

      sel.value = 'ko'; sel.dispatchEvent(new Event('change'));  // 한국어 복귀 확인
      var backH1 = d.querySelector('h1').textContent.trim();

      var ok = jaH1 === '必要な道具だけ、無料で' && jaNav === '画像圧縮' &&
               jaLang === 'ja' && backH1 === koH1;
      log('다국어 전환 (일본어)', ok,
          'JA "' + jaH1 + '" / 메뉴 "' + jaNav + '" / 한국어 복귀 ' + (backH1 === koH1 ? 'OK' : '실패'));
    });
  }).catch(function (e) { log('다국어 전환 (일본어)', false, '오류: ' + e.message); });

  // 14. 영어 페이지 - PDF 합치기가 실제로 동작하는지
  chain = chain.then(function () {
    if (typeof PDFLib === 'undefined') { log('EN: PDF merge', false, 'pdf-lib 로드 실패'); return; }
    function makePdf(n, name) {
      return PDFLib.PDFDocument.create().then(function (doc) {
        for (var i = 0; i < n; i++) { doc.addPage([300, 400]); }
        return doc.save();
      }).then(function (b) { return new File([b], name, { type: 'application/pdf' }); });
    }
    return Promise.all([makePdf(2, 'a.pdf'), makePdf(4, 'b.pdf')]).then(function (files) {
      return loadFrame('../en/pdf-merge.html').then(function (f) {
        var d = f.contentDocument;
        setFiles(d.getElementById('file'), files);
        return waitFor(function () { return txt(d, 't-files') !== '0'; }, 12000).then(function () {
          var n = txt(d, 't-files'), pages = txt(d, 't-pages');
          var h1 = d.querySelector('h1').textContent.trim();
          log('EN: PDF merge', n === '2' && pages === '6' && h1 === 'Merge PDF without uploading',
              n + ' files, ' + pages + ' pages (기대: 2/6), h1 "' + h1 + '"');
        });
      });
    });
  }).catch(function (e) { log('EN: PDF merge', false, '오류: ' + e.message); });

  // 15. 영어 페이지 - CSV 읽기 (인코딩 처리 포함)
  chain = chain.then(function () {
    return loadFrame('../en/file-convert.html').then(function (f) {
      var d = f.contentDocument;
      var csv = 'name,age,city\nJosé,30,Zürich\nAda,36,London\n';
      setFiles(d.getElementById('file'), [new File([csv], 'test.csv', { type: 'text/csv' })]);
      return waitFor(function () { return txt(d, 't-rows') !== '0'; }, 10000).then(function () {
        var rows = txt(d, 't-rows'), cols = txt(d, 't-cols');
        var accents = d.getElementById('preview').textContent.indexOf('José') >= 0 &&
                      d.getElementById('preview').textContent.indexOf('Zürich') >= 0;
        log('EN: CSV convert', rows === '2' && cols === '3' && accents,
            rows + ' rows ' + cols + ' cols, accents ' + (accents ? 'OK' : 'mangled') + ' (기대: 2/3)');
      });
    });
  }).catch(function (e) { log('EN: CSV convert', false, '오류: ' + e.message); });

  // 16. 영어 페이지 - QR 생성
  chain = chain.then(function () {
    return loadFrame('../en/qr-generate.html').then(function (f) {
      var d = f.contentDocument;
      var t = d.getElementById('text');
      t.value = 'https://toolmoa.github.io/en/';
      t.dispatchEvent(new Event('input'));
      return waitFor(function () { return !d.getElementById('canvas').hidden; }, 8000).then(function () {
        var c = d.getElementById('canvas');
        var px = c.getContext('2d').getImageData(0, 0, c.width, c.height).data;
        var dark = 0, light = 0;
        for (var i = 0; i < px.length; i += 4) {
          if (px[i + 3] < 128) continue;
          if (px[i] < 100) dark++; else if (px[i] > 200) light++;
        }
        log('EN: QR code', !c.hidden && dark > 500 && light > 500,
            c.width + '×' + c.height + ', dark ' + dark.toLocaleString() + ' / light ' + light.toLocaleString());
      });
    });
  }).catch(function (e) { log('EN: QR code', false, '오류: ' + e.message); });

  // 17. 한국어 페이지에서 영어를 고르면 /en/ 로 이동하는지
  chain = chain.then(function () {
    return loadFrame('../pdf-merge.html').then(function (f) {
      var d = f.contentDocument;
      var sel = d.querySelector('.lang-select');
      if (!sel) { log('EN 이동 연결', false, '언어 선택기 없음'); return; }
      sel.value = 'en';
      sel.dispatchEvent(new Event('change'));
      return waitFor(function () {
        return /\/en\/pdf-merge\.html$/.test(f.contentWindow.location.pathname);
      }, 6000).then(function (ok) {
        log('EN 이동 연결', ok,
            '이동 결과: ' + f.contentWindow.location.pathname.split('/').slice(-2).join('/'));
      });
    });
  }).catch(function (e) { log('EN 이동 연결', false, '오류: ' + e.message); });

  // 18. 텍스트 정리
  chain = chain.then(function () {
    return loadFrame('../text-clean.html').then(function (f) {
      var d = f.contentDocument;
      var src = d.getElementById('src');
      // 중복 2개, 빈 줄 1개, 앞뒤 공백 포함 → 정리하면 3줄이어야 한다
      src.value = '사과\n  바나나  \n사과\n\n체리\n';
      src.dispatchEvent(new Event('input'));
      var out = d.getElementById('out').value.split('\n');
      var outCount = txt(d, 't-out');

      // 정렬도 확인
      var sort = d.getElementById('sort');
      sort.value = 'asc'; sort.dispatchEvent(new Event('change'));
      var sorted = d.getElementById('out').value.split('\n');

      log('텍스트 정리', out.length === 3 && out.indexOf('바나나') >= 0 &&
          outCount === '3' && sorted[0] === '바나나',
          '중복·빈줄·공백 포함 5줄 → ' + out.length + '줄 [' + out.join(', ') + '], ' +
          '가나다 정렬 첫 줄 "' + sorted[0] + '" (기대: 바나나)');
    });
  }).catch(function (e) { log('텍스트 정리', false, '오류: ' + e.message); });

  // 19. 비밀번호 생성기
  chain = chain.then(function () {
    return loadFrame('../password-gen.html').then(function (f) {
      var d = f.contentDocument;
      d.getElementById('len').value = '24';
      d.getElementById('len').dispatchEvent(new Event('input'));
      d.getElementById('count').value = '10';
      d.getElementById('count').dispatchEvent(new Event('change'));
      var codes = Array.prototype.map.call(d.querySelectorAll('#list code'),
        function (c) { return c.textContent; });

      var allLen = codes.every(function (p) { return p.length === 24; });
      var uniq = codes.filter(function (v, i, a) { return a.indexOf(v) === i; }).length;
      // '헷갈리는 글자 빼기'가 켜져 있으므로 l 1 I O 0 이 없어야 한다
      var noAmb = codes.every(function (p) { return !/[l1IO0]/.test(p); });
      // 종류를 최소 1개씩 포함하는지
      var hasAll = codes.every(function (p) {
        return /[a-z]/.test(p) && /[A-Z]/.test(p) && /[0-9]/.test(p) && /[^a-zA-Z0-9]/.test(p);
      });

      log('비밀번호 생성기', codes.length === 10 && allLen && uniq === 10 && noAmb && hasAll,
          codes.length + '개 생성, 길이 24 ' + (allLen ? 'OK' : '실패') +
          ', 서로 다름 ' + uniq + '/10, 헷갈리는 글자 제외 ' + (noAmb ? 'OK' : '실패') +
          ', 4종류 모두 포함 ' + (hasAll ? 'OK' : '실패'));
    });
  }).catch(function (e) { log('비밀번호 생성기', false, '오류: ' + e.message); });

  // ===== 2026-09-29 추가한 툴 4종 (화면 동작) =====

  function makeSolid(w, h, color) {
    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    var x = c.getContext('2d');
    x.fillStyle = color; x.fillRect(0, 0, w, h);
    return new Promise(function (r) { c.toBlob(r, 'image/png'); });
  }

  var NAMES = ['김민준', '이서연', '박지호', '최수아', '정하윤'];

  // 랜덤 뽑기 — 뽑은 결과가 명단 안에 있고 서로 겹치지 않는지
  chain = chain.then(function () {
    return loadFrame('../random-pick.html').then(function (f) {
      var d = f.contentDocument;
      var ta = d.getElementById('names');
      ta.value = NAMES.join('\n');
      ta.dispatchEvent(new Event('input', { bubbles: true }));
      d.getElementById('mode').value = 'draw';
      d.getElementById('mode').dispatchEvent(new Event('change', { bubbles: true }));
      d.getElementById('pick').value = '3';
      d.getElementById('btn-go').click();

      var items = Array.prototype.map.call(d.querySelectorAll('#out li'), function (li) {
        return li.textContent.trim();
      });
      var uniq = items.filter(function (v, i, a) { return a.indexOf(v) === i; }).length;
      var inList = items.every(function (v) { return NAMES.indexOf(v) >= 0; });
      var hintOk = /5/.test(d.getElementById('count-hint').textContent);

      // 중복 허용을 켜면 인원보다 많이 뽑을 수 있어야 한다
      d.getElementById('dup').checked = true;
      d.getElementById('pick').value = '7';
      d.getElementById('btn-go').click();
      var many = d.querySelectorAll('#out li').length;

      log('랜덤 뽑기', items.length === 3 && uniq === 3 && inList && hintOk && many === 7,
          '5명 중 3명 뽑기 → ' + items.length + '명 (서로 다름 ' + uniq + '/3, 명단 안 ' +
          (inList ? 'OK' : '벗어남') + '), 참가자 수 표시 ' + (hintOk ? 'OK' : '실패') +
          ', 중복 허용 7명 요청 → ' + many + '명');
    });
  }).catch(function (e) { log('랜덤 뽑기', false, '오류: ' + e.message); });

  // 랜덤 조 나누기·순서 섞기 — 한 명도 빠지거나 늘지 않아야 한다
  chain = chain.then(function () {
    return loadFrame('../random-pick.html').then(function (f) {
      var d = f.contentDocument;
      var ta = d.getElementById('names');
      ta.value = NAMES.join('\n');
      ta.dispatchEvent(new Event('input', { bubbles: true }));

      var mode = d.getElementById('mode');
      mode.value = 'teams'; mode.dispatchEvent(new Event('change', { bubbles: true }));
      var groupsShown = !d.getElementById('groups-field').hidden;
      d.getElementById('groups').value = '2';
      d.getElementById('btn-go').click();
      var cards = d.querySelectorAll('#out .card').length;
      var inTeams = Array.prototype.map.call(d.querySelectorAll('#out li'), function (li) {
        return li.textContent.trim();
      }).sort().join(',');

      mode.value = 'shuffle'; mode.dispatchEvent(new Event('change', { bubbles: true }));
      d.getElementById('btn-go').click();
      var shuffled = Array.prototype.map.call(d.querySelectorAll('#out li'), function (li) {
        return li.textContent.trim();
      });
      var sameSet = shuffled.slice().sort().join(',') === NAMES.slice().sort().join(',');

      d.getElementById('btn-clear').click();
      var cleared = d.getElementById('out').innerHTML === '' && d.getElementById('names').value === '';

      log('랜덤 조 나누기·섞기',
          groupsShown && cards === 2 && inTeams === NAMES.slice().sort().join(',') &&
          shuffled.length === 5 && sameSet && cleared,
          '2개 조 → 카드 ' + cards + '개, 조에 담긴 인원 ' + inTeams.split(',').length +
          '명 (명단과 일치 ' + (inTeams === NAMES.slice().sort().join(',') ? 'OK' : '불일치') +
          '), 섞기 ' + shuffled.length + '명 집합 동일 ' + (sameSet ? 'OK' : '실패') +
          ', 비우기 ' + (cleared ? 'OK' : '실패'));
    });
  }).catch(function (e) { log('랜덤 조 나누기·섞기', false, '오류: ' + e.message); });

  // 복사할 것이 없을 때 조용히 넘어가지 않고 알려주는지
  chain = chain.then(function () {
    return loadFrame('../random-pick.html').then(function (f) {
      var d = f.contentDocument;
      d.getElementById('btn-copy').click();
      var err = d.querySelector('#msg .notice.err');
      d.getElementById('btn-go').click();          // 명단이 비어 있을 때도 알려야 한다
      var err2 = d.querySelector('#msg .notice.err');
      log('랜덤 뽑기 빈 입력 안내', !!err && !!err2,
          '결과 없이 복사 → ' + (err ? '안내 표시' : '반응 없음') +
          ', 명단 없이 뽑기 → ' + (err2 ? '안내 표시' : '반응 없음'));
    });
  }).catch(function (e) { log('랜덤 뽑기 빈 입력 안내', false, '오류: ' + e.message); });

  // 이미지 형식 변환 — 형식에 따라 화질·배경 칸이 맞게 나타나는지
  chain = chain.then(function () {
    return makeSolid(30, 20, '#123456').then(function (blob) {
      return loadFrame('../image-convert.html').then(function (f) {
        var d = f.contentDocument;
        var to = d.getElementById('to');
        to.value = 'image/png'; to.dispatchEvent(new Event('change', { bubbles: true }));
        var qHiddenForPng = d.getElementById('q-field').hidden;
        var noneAllowed = !d.querySelector('#bg option[value="none"]').disabled;

        to.value = 'image/jpeg'; to.dispatchEvent(new Event('change', { bubbles: true }));
        var qShownForJpg = !d.getElementById('q-field').hidden;
        // JPG 는 투명을 담을 수 없으므로 "투명하게 두기"를 고를 수 없어야 한다
        var noneBlocked = d.querySelector('#bg option[value="none"]').disabled;

        var bg = d.getElementById('bg');
        bg.value = 'custom'; bg.dispatchEvent(new Event('change', { bubbles: true }));
        var pickerShown = !d.getElementById('bg-color').hidden;
        d.getElementById('quality').value = '80';
        d.getElementById('quality').dispatchEvent(new Event('input', { bubbles: true }));
        var qLabel = d.getElementById('q-val').textContent;

        setFiles(d.getElementById('file'), [new File([blob], '그림.png', { type: 'image/png' })]);
        return waitFor(function () { return d.getElementById('t-count').textContent === '1'; }, 15000)
          .then(function (ok) {
            var hasSave = !!d.getElementById('btn-all');
            var meta = (d.querySelector('#list .fmeta') || {}).textContent || '';
            log('이미지 형식 변환 화면',
                qHiddenForPng && noneAllowed && qShownForJpg && noneBlocked &&
                pickerShown && qLabel === '80%' && ok && hasSave && /30×20/.test(meta),
                'PNG 선택 시 화질칸 숨김 ' + (qHiddenForPng ? 'OK' : '실패') +
                ', JPG 선택 시 표시 ' + (qShownForJpg ? 'OK' : '실패') +
                ', JPG에서 투명 유지 차단 ' + (noneBlocked ? 'OK' : '실패') +
                ', 색 고르기 칸 ' + (pickerShown ? 'OK' : '실패') +
                ', 화질 표시 ' + qLabel + ', 목록 "' + meta.trim() + '"');
          });
      });
    });
  }).catch(function (e) { log('이미지 형식 변환 화면', false, '오류: ' + e.message); });

  // 사진 이어붙이기 — 방향·격자·간격에 따라 결과 크기가 계산대로 나오는지
  chain = chain.then(function () {
    return Promise.all([makeSolid(100, 50, '#ff0000'), makeSolid(60, 30, '#0000ff')])
      .then(function (blobs) {
        return loadFrame('../image-join.html').then(function (f) {
          var d = f.contentDocument;
          setFiles(d.getElementById('file'), [
            new File([blobs[0]], 'a.png', { type: 'image/png' }),
            new File([blobs[1]], 'b.png', { type: 'image/png' })
          ]);
          return waitFor(function () { return d.getElementById('t-count').textContent === '2'; }, 15000)
            .then(function () {
              function set(id, v) {
                var el = d.getElementById(id);
                el.value = v;
                el.dispatchEvent(new Event('change', { bubbles: true }));
              }
              set('align', 'fit');
              set('gap', '0');
              set('bgc', '#ffffff');
              set('dir', 'v');
              var vSize = d.getElementById('t-size').textContent;    // 기대 60×60
              set('dir', 'h');
              var hSize = d.getElementById('t-size').textContent;    // 기대 120×30
              set('dir', 'g');
              var colsShown = !d.getElementById('cols-field').hidden;
              set('cols', '2');
              set('gap', '10');
              var gSize = d.getElementById('t-size').textContent;    // 기대 130×30
              // 순서를 바꾸면 목록 번호도 따라 바뀌어야 한다
              var second = d.querySelectorAll('#list li')[1];
              second.querySelector('button[aria-label]').click();     // ↑ 앞으로
              var firstName = d.querySelector('#list .fname').textContent;

              log('사진 이어붙이기 배치',
                  vSize === '60×60' && hSize === '120×30' && colsShown && gSize === '130×30' &&
                  /b\.png$/.test(firstName),
                  '세로 ' + vSize + ' (기대 60×60), 가로 ' + hSize + ' (기대 120×30), 격자 2열·간격10 ' +
                  gSize + ' (기대 130×30), 한 줄 장수 칸 ' + (colsShown ? 'OK' : '숨음') +
                  ', ↑로 옮긴 뒤 첫 항목 "' + firstName + '"');
            });
        });
      });
  }).catch(function (e) { log('사진 이어붙이기 배치', false, '오류: ' + e.message); });

  // PDF → 이미지 — 페이지 선택과 해상도 안내가 화면에 맞게 나오는지.
  //
  // 반드시 실제 PDF 를 쓴다. pdf-lib 으로 만든 합성 PDF 는 pdf.js 3.11.174 에서
  // getDocument 까지는 되는데 page.render 가 끝나지도 실패하지도 않는다.
  // 합성 PDF 로 검사하면 미리보기가 영영 0장이라 거짓 실패가 난다.
  chain = chain.then(function () {
    return fetch('fixtures/real-b.pdf').then(function (r) { return r.ok ? r.blob() : null; })
      .catch(function () { return null; })
      .then(function (blob) {
        if (!blob) { log('PDF→이미지 화면', false, '고정자료 fixtures/real-b.pdf 없음'); return; }
        return loadFrame('../pdf-to-image.html').then(function (f) {
          var d = f.contentDocument;
          setFiles(d.getElementById('file'), [new File([blob], 'real-b.pdf', { type: 'application/pdf' })]);
          return waitFor(function () { return d.getElementById('t-pages').textContent !== '0'; }, 40000)
            .then(function (loaded) {
              var pages = parseInt(d.getElementById('t-pages').textContent, 10);
              // 비워 두면 전체를 뜻한다
              var allPick = d.getElementById('t-pick').textContent;
              var allOk = parseInt(allPick, 10) === pages;
              var r2 = d.getElementById('range');
              r2.value = '1'; r2.dispatchEvent(new Event('input', { bubbles: true }));
              var onePick = d.getElementById('t-pick').textContent;
              var zipHiddenForOne = d.getElementById('zip-field').hidden;

              // 고정자료의 쪽수에 기대지 않는다 (1쪽짜리로 바뀌어도 거짓 실패하지 않게)
              r2.value = pages >= 2 ? '1-2' : '1';
              r2.dispatchEvent(new Event('input', { bubbles: true }));
              var zipShown = pages < 2 || !d.getElementById('zip-field').hidden;

              function px(scale) {
                var s = d.getElementById('scale');
                s.value = String(scale); s.dispatchEvent(new Event('change', { bubbles: true }));
                var n = (d.getElementById('s-hint').textContent.match(/\d+/g) || []).slice(-2);
                return n.map(Number);
              }
              var at1 = px(1), at2 = px(2);
              // 배율을 두 배로 하면 픽셀도 두 배가 되어야 한다 (한도에 걸리지 않는 한)
              var doubles = at1.length === 2 && at2.length === 2 &&
                            Math.abs(at2[0] - at1[0] * 2) <= 2 && Math.abs(at2[1] - at1[1] * 2) <= 2;

              var fmt = d.getElementById('fmt');
              fmt.value = 'png'; fmt.dispatchEvent(new Event('change', { bubbles: true }));
              var qHidden = d.getElementById('q-field').hidden;
              fmt.value = 'jpg'; fmt.dispatchEvent(new Event('change', { bubbles: true }));
              var qShown = !d.getElementById('q-field').hidden;
              d.getElementById('quality').value = '70';
              d.getElementById('quality').dispatchEvent(new Event('input', { bubbles: true }));
              var qLabel = d.getElementById('q-val').textContent;

              // 카드만 있고 그림이 비어도 화면상으로는 티가 안 난다. 캔버스 수로 본다.
              return waitFor(function () {
                return d.querySelectorAll('#grid canvas').length === pages;
              }, 40000).then(function (thumbs) {
                var drawn = d.querySelectorAll('#grid canvas').length;
                log('PDF→이미지 화면',
                    loaded && allOk && parseInt(onePick, 10) === 1 && zipHiddenForOne &&
                    zipShown && doubles && qHidden && qShown && qLabel === '70' && thumbs,
                    pages + '쪽 · 비움=전체 "' + allPick + '" ' + (allOk ? 'OK' : '불일치') +
                    ', 1쪽 선택 "' + onePick + '", ZIP칸 1장일 때 ' +
                    (zipHiddenForOne ? '숨음' : '표시') + '·2장일 때 ' + (zipShown ? '표시' : '숨음') +
                    ', 1배 ' + at1.join('×') + ' → 2배 ' + at2.join('×') + ' (두 배 ' +
                    (doubles ? 'OK' : '어긋남') + '), PNG에서 화질칸 ' + (qHidden ? '숨김' : '표시') +
                    ', 화질 표시 ' + qLabel + ', 미리보기 ' + drawn + '/' + pages + '장');
              });
            });
        });
      });
  }).catch(function (e) { log('PDF→이미지 화면', false, '오류: ' + e.message); });

  chain.then(render);
}

function render() {
  var pass = results.filter(function (r) { return r.ok; }).length;
  document.getElementById('summary').innerHTML =
    pass + ' / ' + results.length + ' 통과' +
    (pass === results.length ? ' <span class="pass">— 전부 정상</span>' : ' <span class="fail">— 실패 항목 있음</span>');
  document.getElementById('rows').innerHTML = results.map(function (r) {
    return '<tr><td>' + r.name + '</td><td class="' + (r.ok ? 'pass">PASS' : 'fail">FAIL') +
           '</td><td>' + r.detail + '</td></tr>';
  }).join('');

  // 창 제목으로 결과를 내보낸다 (외부에서 실제 시간으로 폴링해 읽기 위함)
  var fails = results.filter(function (r) { return !r.ok; })
    .map(function (r) { return r.name + ' >> ' + r.detail; }).join(' ;; ');
  document.title = 'RESULT ' + pass + '/' + results.length + ' :: ' +
    results.map(function (r) { return r.name + '=' + (r.ok ? 'PASS' : 'FAIL'); }).join(' | ') +
    (fails ? ' :: FAILDETAIL :: ' + fails : '');
}

window.addEventListener('load', function () { setTimeout(run, 200); });
</script>
