<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>색상 코드 변환 · 바코드 생성 점검</title>
<style>
  body { font-family:"Malgun Gothic",sans-serif; padding:24px; background:#fff; color:#111; }
  table { border-collapse:collapse; width:100%; max-width:1100px; font-size:14px; }
  th,td { text-align:left; padding:7px 10px; border-bottom:1px solid #ddd; vertical-align:top; }
  th { background:#f2f4f7; }
  .pass { color:#0a7f3f; font-weight:700; }
  .fail { color:#c62828; font-weight:700; }
  #summary { font-size:18px; font-weight:700; margin:16px 0; }
  iframe { position:absolute; left:-9999px; width:1100px; height:900px; border:0; }
</style>
</head>
<body>
<h1 style="font-size:22px">색상 코드 변환 · 바코드 생성 점검 (2026-10-19)</h1>
<p style="color:#555;font-size:14px;max-width:980px">
  색상은 손으로 계산한 값과 대조한다. 바코드는 그려진 캔버스의 픽셀을 다시 읽어 모듈(칸) 열로 되돌린 뒤,
  검사 페이지 안의 별도 해석기로 EAN-13·EAN-8·Code 128 을 다시 읽어 원문과 맞는지 본다 (표는 같지만 인코딩·검사 기호·그리기는 독립 검증).
</p>
<div id="summary">실행 중…</div>
<table><thead><tr><th style="width:220px">항목</th><th style="width:60px">결과</th><th>확인</th></tr></thead>
<tbody id="rows"></tbody></table>

<script>
try { localStorage.setItem('toolmoa_lang', 'ko'); } catch (e) {}
var results = [];
function log(n, ok, d) { results.push({ name: n, ok: ok, detail: d }); }
function waitFor(c, ms) {
  var s = Date.now(), lim = ms || 10000;
  return new Promise(function (r) {
    (function p() {
      var o = false; try { o = c(); } catch (e) {}
      if (o || Date.now() - s > lim) { r(o); return; }
      setTimeout(p, 60);
    })();
  });
}
function loadFrame(src) {
  return new Promise(function (res, rej) {
    var f = document.createElement('iframe');
    f.dataset.errs = '';
    f.src = src;
    f.onload = function () {
      try { f.contentWindow.addEventListener('error', function (e) { f.dataset.errs += (e.message || 'err') + ' | '; }); } catch (e) {}
      setTimeout(function () { res(f); }, 300);
    };
    f.onerror = function () { rej(new Error('로드 실패: ' + src)); };
    document.body.appendChild(f);
  });
}
function txt(d, id) { var e = d.getElementById(id); return e ? e.textContent.trim() : ''; }
function setVal(d, id, v, ev) { var e = d.getElementById(id); e.value = v; e.dispatchEvent(new Event(ev || 'input', { bubbles: true })); }
function capture(f) {
  var w = f.contentWindow, out = [], names = [];
  var orig = w.URL.createObjectURL.bind(w.URL);
  w.URL.createObjectURL = function (b) { if (typeof b.name !== 'string') out.push(b); return orig(b); };
  w.HTMLAnchorElement.prototype.click = function () { names.push(this.download); };
  return { blobs: out, names: names };
}
// 결과 표를 {이름표: 값} 으로
function rowsOf(d) {
  var o = {};
  Array.prototype.forEach.call(d.querySelectorAll('#rows tr'), function (tr) { o[tr.children[0].textContent.trim()] = tr.children[1].textContent.trim(); });
  return o;
}

/* ===== 바코드 해석기 (검사 전용, 페이지 코드와 무관) ===== */
function readModules(canvas, scale) {
  var ctx = canvas.getContext('2d'), quiet = 10 * scale, n = Math.round((canvas.width - quiet * 2) / scale), m = '';
  var row = ctx.getImageData(0, 10, canvas.width, 1).data;
  for (var i = 0; i < n; i++) { var x = quiet + i * scale + Math.floor(scale / 2); m += row[x * 4] < 128 ? '1' : '0'; }
  return m;
}
var L = ['0001101', '0011001', '0010011', '0111101', '0100011', '0110001', '0101111', '0111011', '0110111', '0001011'];
var G = L.map(function (p) { return p.split('').reverse().join(''); });
var R = L.map(function (p) { return p.replace(/[01]/g, function (c) { return c === '0' ? '1' : '0'; }); });
var PARITY = ['LLLLLL', 'LLGLGG', 'LLGGLG', 'LLGGGL', 'LGLLGG', 'LGGLLG', 'LGGGLL', 'LGLGLG', 'LGLGGL', 'LGGLGL'];
function decodeEan13(m) {
  if (m.length !== 95 || m.slice(0, 3) !== '101' || m.slice(45, 50) !== '01010' || m.slice(92) !== '101') return 'guard 불일치 (' + m.length + ')';
  var par = '', digits = '';
  for (var i = 0; i < 6; i++) {
    var seg = m.slice(3 + i * 7, 10 + i * 7), li = L.indexOf(seg), gi = G.indexOf(seg);
    if (li >= 0) { par += 'L'; digits += li; } else if (gi >= 0) { par += 'G'; digits += gi; } else return '왼쪽 ' + i + ' 해석 불가';
  }
  var first = PARITY.indexOf(par); if (first < 0) return '패리티 불일치 ' + par;
  for (i = 0; i < 6; i++) { var ri = R.indexOf(m.slice(50 + i * 7, 57 + i * 7)); if (ri < 0) return '오른쪽 ' + i + ' 해석 불가'; digits += ri; }
  return String(first) + digits;
}
function decodeEan8(m) {
  if (m.length !== 67 || m.slice(0, 3) !== '101' || m.slice(31, 36) !== '01010' || m.slice(64) !== '101') return 'guard 불일치 (' + m.length + ')';
  var digits = '';
  for (var i = 0; i < 4; i++) { var li = L.indexOf(m.slice(3 + i * 7, 10 + i * 7)); if (li < 0) return '왼쪽 해석 불가'; digits += li; }
  for (i = 0; i < 4; i++) { var ri = R.indexOf(m.slice(36 + i * 7, 43 + i * 7)); if (ri < 0) return '오른쪽 해석 불가'; digits += ri; }
  return digits;
}
var C128 = ['212222', '222122', '222221', '121223', '121322', '131222', '122213', '122312', '132212', '221213', '221312', '231212', '112232', '122132', '122231', '113222', '123122', '123221', '223211', '221132', '221231', '213212', '223112', '312131', '311222', '321122', '321221', '312212', '322112', '322211', '212123', '212321', '232121', '111323', '131123', '131321', '112313', '132113', '132311', '211313', '231113', '231311', '112133', '112331', '132131', '113123', '113321', '133121', '313121', '211331', '231131', '213113', '213311', '213131', '311123', '311321', '331121', '312113', '312311', '332111', '314111', '221411', '431111', '111224', '111422', '121124', '121421', '141122', '141221', '112214', '112412', '122114', '122411', '142112', '142211', '241211', '221114', '413111', '241112', '134111', '111242', '121142', '121241', '114212', '124112', '124211', '411212', '421112', '421211', '212141', '214121', '412121', '111143', '111341', '131141', '114113', '114311', '411113', '411311', '113141', '114131', '311141', '411131', '211412', '211214', '211232', '2331112'];
function decodeCode128(m) {
  // 모듈 열 → 폭 열 (막대·공백 교대)
  var widths = [], cur = m[0], n = 0;
  for (var i = 0; i < m.length; i++) { if (m[i] === cur) n++; else { widths.push(n); cur = m[i]; n = 1; } }
  widths.push(n);
  if (m[0] !== '1') return '막대로 시작하지 않음';
  var vals = [], pos = 0;
  while (pos + 6 <= widths.length) {
    var six = widths.slice(pos, pos + 6).join('');
    if (pos + 7 === widths.length && widths.slice(pos).join('') === '2331112') { vals.push(106); pos += 7; break; }
    var v = C128.indexOf(six); if (v < 0) return '기호 해석 불가 @' + pos + ' ' + six;
    vals.push(v); pos += 6;
  }
  if (vals[vals.length - 1] !== 106) return '정지 기호 없음';
  var sum = vals[0]; for (i = 1; i < vals.length - 2; i++) sum += vals[i] * i;
  if (sum % 103 !== vals[vals.length - 2]) return '검사 기호 불일치 ' + (sum % 103) + '≠' + vals[vals.length - 2];
  var mode = vals[0] === 104 ? 'B' : vals[0] === 105 ? 'C' : 'A', out = '';
  for (i = 1; i < vals.length - 2; i++) {
    var v2 = vals[i];
    if (v2 === 99) { mode = 'C'; continue; } if (v2 === 100) { mode = 'B'; continue; } if (v2 === 101) { mode = 'A'; continue; }
    if (mode === 'C') out += (v2 < 10 ? '0' : '') + v2; else out += String.fromCharCode(v2 + 32);
  }
  return out;
}

function run() {
  var chain = Promise.resolve();

  // ===== 1. 색상 변환 6종 형식 =====
  chain = chain.then(function () {
    return loadFrame('../color-convert.html').then(function (f) {
      var d = f.contentDocument, got = {};
      setVal(d, 'cin', '#3498db'); got.a = rowsOf(d);
      setVal(d, 'cin', 'rgb(255, 0, 0)'); got.b = rowsOf(d);
      setVal(d, 'cin', 'hsl(120, 100%, 50%)'); got.c = rowsOf(d);
      setVal(d, 'cin', 'tomato'); got.d = rowsOf(d);
      setVal(d, 'cin', '#fff'); got.e = rowsOf(d);
      setVal(d, 'cin', '#ff000080'); got.f = rowsOf(d);
      setVal(d, 'cin', 'nope'); var bad = txt(d, 'parse-msg');
      setVal(d, 'cin', '2f6df6'); got.g = rowsOf(d);
      var ok = got.a.HEX === '#3498db' && got.a.RGB === 'rgb(52, 152, 219)' && got.a.HSL === 'hsl(204, 70%, 53%)' && got.a['HSV/HSB'] === 'hsv(204, 76%, 86%)' && got.a.CMYK === 'cmyk(76%, 31%, 0%, 14%)' &&
               got.b.HEX === '#ff0000' && got.b['10진수'] === '16711680' && got.c.HEX === '#00ff00' && got.d.HEX === '#ff6347' && got.e.HEX === '#ffffff' && got.e['휘도'] === '100%' &&
               got.f['HEX+α'] === '#ff000080' && got.f.RGBA === 'rgba(255, 0, 0, 0.5)' && /알 수 없는 형식/.test(bad) && got.g.HEX === '#2f6df6' && d.getElementById('picker').value === '#2f6df6' && !f.dataset.errs;
      log('색상 변환 형식 7종', ok, '#3498db → ' + [got.a.RGB, got.a.HSL, got.a['HSV/HSB'], got.a.CMYK].join(' / ') + ' · rgb→' + got.b.HEX + ' 10진 ' + got.b['10진수'] + ' · hsl→' + got.c.HEX + ' · tomato→' + got.d.HEX + ' · #fff→' + got.e.HEX + ' 휘도 ' + got.e['휘도'] + ' · α ' + got.f['HEX+α'] + ' ' + got.f.RGBA + ' · nope "' + bad.slice(0, 20) + '" · # 없이 ' + got.g.HEX + ' 피커 ' + d.getElementById('picker').value);
      f.remove();
    });
  }).catch(function (e) { log('색상 변환 형식 7종', false, '오류: ' + e.message); });

  // ===== 2. 대비 · 팔레트 · 복사 · 피커 =====
  chain = chain.then(function () {
    return loadFrame('../color-convert.html').then(function (f) {
      var d = f.contentDocument, w = f.contentWindow, copied = [];
      w.navigator.clipboard.writeText = function (s) { copied.push(s); return Promise.resolve(); };
      setVal(d, 'cin2', '#000000'); setVal(d, 'cin3', '#ffffff');
      var r1 = txt(d, 'ratio'), b1 = d.querySelectorAll('#badges .ok').length;
      setVal(d, 'cin2', '#777777');
      var r2 = txt(d, 'ratio'), badges = Array.prototype.map.call(d.querySelectorAll('#badges .cc-badge'), function (b) { return b.textContent.trim(); }).join(' | ');
      d.getElementById('btn-swap').click();
      var r3 = txt(d, 'ratio'), swapped = d.getElementById('cin2').value + '/' + d.getElementById('cin3').value;
      setVal(d, 'cin', '#2f6df6'); d.getElementById('btn-use').click();
      var used = d.getElementById('cin3').value;
      var shades = d.querySelectorAll('#pal-shade button').length, harmony = d.querySelectorAll('#pal-harmony button').length;
      var comp = d.querySelectorAll('#pal-harmony button')[1].getAttribute('data-hex');
      d.querySelectorAll('#pal-harmony button')[1].click();
      var p2 = d.getElementById('picker2'); p2.value = '#112233'; p2.dispatchEvent(new Event('input', { bubbles: true }));
      var p3 = d.getElementById('picker3'); p3.value = '#eeeeee'; p3.dispatchEvent(new Event('input', { bubbles: true }));
      var pickers = d.getElementById('cin2').value + '/' + d.getElementById('cin3').value + '/' + txt(d, 'ratio');
      var pk = d.getElementById('picker'); pk.value = '#ff0000'; pk.dispatchEvent(new Event('input', { bubbles: true }));
      var afterPicker = rowsOf(d).HEX;
      d.querySelector('[data-copy]').click();
      return waitFor(function () { return copied.length >= 2; }).then(function () {
        // #2f6df6 = hsl(216,92%,57%) → 보색 hsl(36,92%,57%) = #f6b82f
        var ok = r1 === '21.00:1' && b1 === 4 && r2 === '4.48:1' && /AA 본문 미달/.test(badges) && /AA 큰 글자 통과/.test(badges) && r3 === '4.48:1' && swapped === '#ffffff/#777777' &&
                 used === '#2f6df6' && shades === 10 && harmony === 8 && comp === '#f6b82f' && copied[0] === '#f6b82f' && afterPicker === '#ff0000' && copied[1] === '#ff0000' && pickers === '#112233/#eeeeee/13.92:1' && !f.dataset.errs;
        log('대비 · 팔레트 · 복사 · 피커', ok, '검정/흰 ' + r1 + ' 통과 ' + b1 + ' · #777/흰 ' + r2 + ' [' + badges + '] · 바꾸기 ' + r3 + ' ' + swapped + ' · 위 색 배경 ' + used + ' · 밝기 ' + shades + ' 조화 ' + harmony + ' 보색 ' + comp + ' · 복사 ' + copied.join(',') + ' · 피커 → ' + afterPicker + ' · picker2/3 → ' + pickers + ' (13.92:1)');
        f.remove();
      });
    });
  }).catch(function (e) { log('대비 · 팔레트 · 복사 · 피커', false, '오류: ' + e.message); });

  // ===== 3. EAN-13: 체크 숫자 계산·검증, 다시 읽기 =====
  chain = chain.then(function () {
    return loadFrame('../barcode.html').then(function (f) {
      var d = f.contentDocument, c = d.getElementById('canvas');
      setVal(d, 'type', 'ean13', 'change'); setVal(d, 'scale', '3', 'change');
      setVal(d, 'text', '978020137962');
      var m1 = readModules(c, 3), dec1 = decodeEan13(m1), info1 = txt(d, 'info');
      setVal(d, 'text', '9780201379625'); var bad = txt(d, 'msg'), sizeBad = c.width;
      setVal(d, 'text', '4006381333931'); var dec2 = decodeEan13(readModules(c, 3)), info2 = txt(d, 'info');
      setVal(d, 'text', '12ab'); var bad2 = txt(d, 'msg');
      setVal(d, 'text', '1234'); var bad3 = txt(d, 'msg');
      var ok = dec1 === '9780201379624' && /체크 숫자 4를 붙였습니다/.test(info1) && /95칸/.test(info1) && /마지막 자리는 4여야/.test(bad) && sizeBad === 1 &&
               dec2 === '4006381333931' && /체크 숫자가 맞습니다/.test(info2) && /숫자만/.test(bad2) && /12자리.*13자리/.test(bad3) && !f.dataset.errs;
      log('EAN-13 생성·검증·재판독', ok, '978020137962 → 다시 읽음 ' + dec1 + ' (기대 9780201379624) · "' + info1.slice(0, 30) + '" · 틀린 체크 "' + bad.slice(0, 40) + '" 캔버스 ' + sizeBad + 'px · 4006381333931 → ' + dec2 + ' "' + info2.slice(0, 14) + '" · 글자 "' + bad2 + '" · 짧음 "' + bad3.slice(0, 30) + '"');
      f.remove();
    });
  }).catch(function (e) { log('EAN-13 생성·검증·재판독', false, '오류: ' + e.message); });

  // ===== 4. EAN-8 · 굵기·높이·글자 표시 · PNG 저장 =====
  chain = chain.then(function () {
    return loadFrame('../barcode.html').then(function (f) {
      var d = f.contentDocument, c = d.getElementById('canvas'), cap = capture(f);
      setVal(d, 'type', 'ean8', 'change'); setVal(d, 'text', '9638507');
      var dec = decodeEan8(readModules(c, 3)), info = txt(d, 'info');
      setVal(d, 'scale', '6', 'change'); var w6 = c.width;
      setVal(d, 'scale', '2', 'change'); var w2 = c.width;
      setVal(d, 'scale', '4', 'change'); var w4 = c.width;
      setVal(d, 'height', '120', 'change'); var hText = c.height;
      d.getElementById('showtext').checked = false; d.getElementById('showtext').dispatchEvent(new Event('change', { bubbles: true }));
      var hNoText = c.height;
      d.getElementById('btn-png').click();
      return waitFor(function () { return cap.blobs.length >= 1; }).then(function () {
        var ok = dec === '96385074' && /체크 숫자 4를/.test(info) && w6 === 67 * 6 + 120 && w2 === 67 * 2 + 40 && w4 === 67 * 4 + 80 && hText > hNoText && hNoText === 130 &&
                 cap.blobs[0].type === 'image/png' && cap.names[0] === '바코드_96385074.png' && /PNG로 저장/.test(txt(d, 'copy-msg')) && !f.dataset.errs;
        log('EAN-8 · 굵기·높이 · PNG', ok, '9638507 → ' + dec + ' (기대 96385074) · 폭 6px ' + w6 + ' (기대 522) 2px ' + w2 + ' (174) 4px ' + w4 + ' (348) · 높이 글자 있음 ' + hText + ' 없음 ' + hNoText + ' (130) · PNG ' + cap.blobs[0].type + ' ' + cap.names[0]);
        f.remove();
      });
    });
  }).catch(function (e) { log('EAN-8 · 굵기·높이 · PNG', false, '오류: ' + e.message); });

  // ===== 5. Code 128: 표 무결성 · 다시 읽기 · 숫자 묶기(C) · 예외 =====
  chain = chain.then(function () {
    var tableOk = C128.length === 107 && C128.every(function (p, i) { var sum = p.split('').reduce(function (a, b) { return a + (+b); }, 0); return i === 106 ? (p.length === 7 && sum === 13) : (p.length === 6 && sum === 11); }) && new Set(C128).size === 107;
    return loadFrame('../barcode.html').then(function (f) {
      var d = f.contentDocument, c = d.getElementById('canvas'), got = [];
      setVal(d, 'type', 'code128', 'change'); setVal(d, 'scale', '3', 'change');
      ['ABC', 'Hello World 2024', '123456', 'A1234567B', 'ORDER-2024-00917', '{}[]~ a-z'].forEach(function (s) {
        setVal(d, 'text', s);
        got.push(decodeCode128(readModules(c, 3)) === s ? s + ' O' : s + ' X(' + decodeCode128(readModules(c, 3)) + ')');
      });
      setVal(d, 'text', '123456'); var noteC = txt(d, 'info');
      setVal(d, 'text', '한글'); var badKo = txt(d, 'msg');
      setVal(d, 'text', ''); var badEmpty = txt(d, 'msg');
      var ok = tableOk && got.every(function (g) { return / O$/.test(g); }) && /기호 6개/.test(noteC) && /영문·숫자·기본 기호만/.test(badKo) && /내용을 입력/.test(badEmpty) && !f.dataset.errs;
      log('Code 128 재판독 6건 · 표 무결성', ok, '표 107개·합 11·중복 없음 ' + tableOk + ' · ' + got.join(' · ') + ' · 123456 "' + noteC.slice(0, 20) + '" (기호 6개 = C 로 묶임) · 한글 "' + badKo.slice(0, 20) + '" · 빈 값 "' + badEmpty + '"');
      f.remove();
    });
  }).catch(function (e) { log('Code 128 재판독 6건 · 표 무결성', false, '오류: ' + e.message); });

  chain.then(render);
}

function render() {
  var pass = results.filter(function (r) { return r.ok; }).length;
  document.getElementById('summary').innerHTML =
    pass + ' / ' + results.length + ' 통과' +
    (pass === results.length ? ' <span class="pass">— 전부 정상</span>' : ' <span class="fail">— 문제 있음</span>');
  document.getElementById('rows').innerHTML = results.map(function (r) {
    return '<tr><td>' + r.name + '</td><td class="' + (r.ok ? 'pass">PASS' : 'fail">FAIL') +
           '</td><td>' + r.detail + '</td></tr>';
  }).join('');
  document.title = 'TOOLS5 ' + pass + '/' + results.length + ' :: ' +
    results.map(function (r) { return r.name + ' [' + (r.ok ? 'PASS' : 'FAIL') + '] ' + r.detail; }).join(' ;; ');
}

window.addEventListener('load', function () { setTimeout(run, 300); });
</script>
</body>
</html>
